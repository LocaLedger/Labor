<!-- Pre-initialize Tailwind config before the CDN loads so the JIT
     engine picks up custom fontSize tokens on its first DOM scan.
     text-xxs  = 10px / 14px lh  (one step below text-xs at 12px)
     text-xxxs =  8px / 12px lh  (two steps below text-xs) -->
<script>
  window.tailwind = {
    config: {
      theme: {
        extend: {
          fontSize: {
            'xxs':  ['0.625rem', { lineHeight: '0.875rem' }],
            'xxxs': ['0.5rem',   { lineHeight: '0.75rem'  }],
          }
        }
      }
    }
  }
</script>

<style>
/* ── Suite Drum Slot-machine ───────────────────────────────────── */
.suite-drum-wrap {
  height: 44px;
  overflow: hidden;
  display: inline-block;
  vertical-align: middle;
  position: relative;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 22%, #000 78%, transparent 100%);
  mask-image:         linear-gradient(to bottom, transparent 0%, #000 22%, #000 78%, transparent 100%);
}
.suite-drum {
  position: relative;
  transition: transform 0.52s cubic-bezier(0.4, 0, 0.2, 1);
  will-change: transform;
}
.suite-face {
  display: block;
  height: 44px;
  line-height: 44px;
  white-space: nowrap;
  font-family: 'Space Mono', 'Courier New', monospace;
  font-size: 28px;
  font-weight: 700;
  color: #6366F1;
}
/* ── Suite Launcher Panel ──────────────────────────────────────── */
#suiteLauncher {
  background: rgba(15,17,26,0.97);
  border-bottom: 1px solid rgba(99,102,241,0.18);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}
.suite-module-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid transparent;
  background: rgba(255,255,255,0.03);
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, transform 0.1s;
  text-align: left;
  width: 100%;
}
.suite-module-btn:active { transform: scale(0.97); }
.suite-module-btn.active {
  background: rgba(99,102,241,0.14);
  border-color: rgba(99,102,241,0.38);
}
.suite-module-btn:not(.active):hover {
  background: rgba(255,255,255,0.06);
  border-color: rgba(255,255,255,0.08);
}
.suite-module-icon {
  width: 34px;
  height: 34px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
/* ── Preview Page ──────────────────────────────────────────────── */
.preview-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
@keyframes previewPulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.preview-pulse { animation: previewPulse 2.4s ease-in-out infinite; }
.preview-feature-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 7px 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  font-size: 13px;
  color: #d1d5db;
}
.preview-feature-item:last-child { border-bottom: none; }
.preview-json {
  background: rgba(0,0,0,0.4);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px;
  padding: 12px;
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  color: #94a3b8;
  overflow-x: auto;
  line-height: 1.6;
  white-space: pre;
}
.preview-flow-arrow {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: #94a3b8;
  padding: 5px 0;
}
/* Pre-declare utilities that only appear in dynamically-injected HTML so they
   are available before the Tailwind CDN Play-mode JIT processes them.        */
.bottom-20        { bottom: 5rem; }
.translate-y-full { transform: translateY(100%); }
</style>

<script>
/* ================================
   STORAGE STRUCTURE
================================= */
const DATA_KEY    = "income_data";
const META_KEY    = "income_meta";
const DEV_MODE_KEY = "ll_dev_mode";
const APP_VERSION = "1.3.2"; // bump this with every deploy (must match version.json)

/**
 * Crisp recurring/sync icon (Heroicons arrow-path, filled).
 * cls sets Tailwind size classes e.g. "w-3 h-3" or "w-4 h-4".
 */
function _recurSvg(cls = 'w-3 h-3') {
  return `<svg class="${cls} inline-block align-middle shrink-0" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M4.755 10.059a7.5 7.5 0 0 1 12.548-3.364l1.903 1.903h-3.183a.75.75 0 1 0 0 1.5h4.992a.75.75 0 0 0 .75-.75V4.356a.75.75 0 0 0-1.5 0v3.18l-1.9-1.9A9 9 0 0 0 3.306 9.67a.75.75 0 1 0 1.45.388Zm15.408 3.352a.75.75 0 0 0-.919.53 7.5 7.5 0 0 1-12.548 3.364l-1.902-1.903h3.183a.75.75 0 0 0 0-1.5H2.984a.75.75 0 0 0-.75.75v4.992a.75.75 0 0 0 1.5 0v-3.18l1.9 1.9a9 9 0 0 0 15.059-4.035.75.75 0 0 0-.53-.918Z" clip-rule="evenodd"/></svg>`;
}

let devMode = localStorage.getItem(DEV_MODE_KEY) === "1";
let devTapCount = 0;

/*
income_data = {
  records: [],
  locations: {
    "Downtown Bar": { lastRate: 25 }
  }
}
*/

function initStorage() {
  if (!localStorage.getItem(DATA_KEY)) {
    localStorage.setItem(DATA_KEY, JSON.stringify({
      records: [],
      locations: {},
      customFields: []
    }));
  }

  if (!localStorage.getItem(META_KEY)) {
    localStorage.setItem(META_KEY, JSON.stringify({
      userId: "user1",
      nextId: 1
    }));
  }
}
initStorage();

/* ================================
   HELPERS
================================= */
const $ = id => document.getElementById(id);

function loadData() {
  return JSON.parse(localStorage.getItem(DATA_KEY));
}
function saveData(d) {
  localStorage.setItem(DATA_KEY, JSON.stringify(d));
}
function loadMeta() {
  return JSON.parse(localStorage.getItem(META_KEY));
}
function saveMeta(m) {
  localStorage.setItem(META_KEY, JSON.stringify(m));
}

function generateId() {
  const m = loadMeta();
  const id = `income_${m.userId}_${m.nextId}`;
  m.nextId++;
  saveMeta(m);
  return id;
}

function todayISO() {
  // Use local date instead of UTC to avoid timezone shifts
  const d = new Date();
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}
function money(v) {
  return `$${Number(v || 0).toFixed(2)}`;
}

function normalizeHexColor(hex) {
  if (!hex) return null;
  const s = String(hex).trim();
  if (!s || s === "none") return null;
  const withHash = s.startsWith("#") ? s : `#${s}`;
  const m = withHash.match(/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/);
  if (!m) return null;
  let h = m[0].toLowerCase();
  if (h.length === 4) {
    h = `#${h[1]}${h[1]}${h[2]}${h[2]}${h[3]}${h[3]}`;
  }
  return h;
}

function hexToRgba(hex, alpha = 1) {
  const h = normalizeHexColor(hex);
  if (!h) return null;
  const r = parseInt(h.slice(1, 3), 16);
  const g = parseInt(h.slice(3, 5), 16);
  const b = parseInt(h.slice(5, 7), 16);
  const a = Math.max(0, Math.min(1, Number(alpha)));
  return `rgba(${r}, ${g}, ${b}, ${a})`;
}

function getLocationPreferredColor(loc) {

  return normalizeHexColor(c);
}

function getLocationTintStyle(loc) {
  const hex = getLocationPreferredColor(loc);
  if (!hex) return "";
  const bg = hexToRgba(hex, 0.10);

  // Per custom field key:
  // - text: { selected: Set<string> }
  // - number/money: { min: number|null, max: number|null }
  // - checkbox: { onlyChecked: boolean }
  custom: {}
};

function countActiveCustomFilters(filters) {
  const custom = filters?.custom || {};
  let count = 0;
  Object.values(custom).forEach(f => {
    if (!f) return;
    if (f.selected && f.selected.size) count += 1;
    else if (typeof f.onlyChecked === "boolean" && f.onlyChecked) count += 1;
    else if (f.min !== null || f.max !== null) count += 1;
  });
  return count;
}

function countActiveDateFilter() {
  return dateFilter && dateFilter.type !== "all" ? 1 : 0;
}

function getRecordFieldValue(record, def) {
  const raw = record?.[def.key];
  if (raw === null || raw === undefined) return null;
  if (def.type === "checkbox") {
    const checked = raw === true || raw === "true" || raw === 1 || raw === "1";
    return checked;
  }
  if (def.type === "number" || def.type === "money") {
    const v = parseFloat(raw);
    return Number.isFinite(v) ? v : null;
  }
  return String(raw);
}

function applyCustomFilters(records, defs, filters) {
  const customDefs = defs || [];
  const active = filters || historyFilters;
  return records.filter(r => {
    for (const def of customDefs) {
      if (!def || !def.key) continue;
      const f = active.custom?.[def.key];
      if (!f) continue;

      if (def.type === "checkbox") {
        if (f.onlyChecked) {
          const checked = getRecordFieldValue(r, def);
          if (!checked) return false;
        }
      } else if (def.type === "number" || def.type === "money") {
        const v = getRecordFieldValue(r, def);
        if (v === null) {
          if (f.min !== null || f.max !== null) return false;
        } else {
          if (f.min !== null && v < f.min) return false;
          if (f.max !== null && v > f.max) return false;
        }
      } else {
        const val = getRecordFieldValue(r, def);
        const selected = f.selected;
        if (selected && selected.size) {
          if (!val || !selected.has(val)) return false;
        }
      }
    }
    return true;
  });
}

function applyHistorySort(records, defs) {
  const out = [...records];
  const t = historySort?.type || "date";
  if (t === "date") {
    out.sort((a, b) => (historySort.direction === "asc" ? a.date.localeCompare(b.date) : b.date.localeCompare(a.date)));
    return out;
  }
  if (t === "total") {
    out.sort((a, b) => {
      const av = calculateRecordTotal(a, defs);
      const bv = calculateRecordTotal(b, defs);
      return historySort.direction === "asc" ? (av - bv) : (bv - av);
    });
    return out;
  }
  if (t === "custom-number" && historySort.key) {
    const def = (defs || []).find(d => d && d.key === historySort.key);
    out.sort((a, b) => {
      const av = def ? (getRecordFieldValue(a, def) ?? -Infinity) : -Infinity;
      const bv = def ? (getRecordFieldValue(b, def) ?? -Infinity) : -Infinity;
      return historySort.direction === "asc" ? (av - bv) : (bv - av);
    });
    return out;
  }
  return out;
}

function applyHistoryFiltersFromUI() {
  const data = loadData();
  const defs = data.customFields || [];
  const next = { custom: {} };

  defs.forEach(def => {
    if (!def || !def.key) return;
    if (def.type === "text" || def.type === "date") {
      const nodes = document.querySelectorAll(`input[type="checkbox"][data-hf-text="${def.key}"]`);
      const selected = new Set();
      nodes.forEach(n => { if (n.checked) selected.add(n.value); });
      if (selected.size) next.custom[def.key] = { selected };
    } else if (def.type === "number" || def.type === "money") {
      const minRaw = document.getElementById(`hf_${def.key}_min`)?.value;
      const maxRaw = document.getElementById(`hf_${def.key}_max`)?.value;
      const min = minRaw === "" ? null : parseFloat(minRaw);
      const max = maxRaw === "" ? null : parseFloat(maxRaw);
      if (min !== null || max !== null) next.custom[def.key] = { min: Number.isFinite(min) ? min : null, max: Number.isFinite(max) ? max : null };
    } else if (def.type === "checkbox") {
      const onlyChecked = !!document.getElementById(`hf_${def.key}_onlyChecked`)?.checked;
      if (onlyChecked) next.custom[def.key] = { onlyChecked: true };
    }
  });

  historyFilters = next;

  const sortVal = $("hf_sort")?.value || "date_desc";
  if (sortVal.startsWith("date_")) {
    historySort = { type: "date", key: null, direction: sortVal.endsWith("_asc") ? "asc" : "desc" };
  } else if (sortVal.startsWith("total_")) {
    historySort = { type: "total", key: null, direction: sortVal.endsWith("_asc") ? "asc" : "desc" };
  } else if (sortVal.startsWith("num_")) {
    const parts = sortVal.split("_"); // num, key..., dir
    const direction = parts[parts.length - 1] === "asc" ? "asc" : "desc";
    const key = parts.slice(1, -1).join("_");
    historySort = { type: "custom-number", key, direction };
  }

  renderHistory();
  closeHistoryFilterMenu();
}

function getCustomFieldDefs() {
  try {
    const d = loadData();
    return d?.customFields || [];
  } catch {
    return [];
  }
}

function calculateBasePay(record) {
  const hours = parseFloat(record?.hours) || 0;
  const rate = parseFloat(record?.rate) || 0;
  const payType = record?.payType === "flat" ? "flat" : "hourly";
  return payType === "flat" ? rate : (hours * rate);
}

function calculateMoneyCustomContribution(record, customFieldDefs) {
  if (!record) return 0;
  const defs = customFieldDefs || [];
  let sum = 0;
  defs.forEach(def => {
    if (!def || def.type !== "money") return;
    const raw = record[def.key];
    if (raw === null || raw === undefined || raw === "") return;
    const v = parseFloat(raw);
    if (!Number.isFinite(v)) return;
    const mode = def.addToTotal || "none"; // "none" | "add" | "subtract"
    if (mode === "add") sum += v;
    else if (mode === "subtract") sum -= v;
  });
  return sum;
}

function calculateRecordTotal(record, customFieldDefs) {
  const tips = parseFloat(record?.tips) || 0;
  return calculateBasePay(record) + tips + calculateMoneyCustomContribution(record, customFieldDefs);
}

/* Toast notifications - bottom right, stacking */
function showToast(message, duration = 3000) {
  let container = $("toast-container");
  if (!container) {
    const c = document.createElement("div");
    c.id = "toast-container";
    c.className = "fixed bottom-24 right-4 z-50 flex flex-col gap-2 max-w-[200px]";
    document.body.appendChild(c);
    container = $("toast-container");
  }
  
  const toast = document.createElement("div");
  toast.className = "bg-gray-800 text-white text-sm px-3 py-2 rounded-lg shadow-lg opacity-90";
  toast.textContent = message;
  container.appendChild(toast);
  console.log("[TOAST]", message);
  
  setTimeout(() => {
    if (toast.parentNode) {
      toast.style.opacity = "0";
      toast.style.transition = "opacity 0.3s";
      setTimeout(() => toast.remove(), 300);
    }
  }, duration);
}

/* Floating label handler */
function updateLabel(labelId) {
  const label = document.getElementById(labelId);
  if (!label) return;
  
  const inputId = label.getAttribute('for');
  const input = document.getElementById(inputId);
  if (!input) return;
  
  const hasValue = input.value && input.value.length > 0;
  
  if (hasValue) {
    label.classList.add('-translate-y-2', 'top-0', 'text-xs', 'text-indigo-400');
    label.classList.remove('top-3', 'text-gray-400', 'text-sm');
  } else {
    label.classList.remove('-translate-y-2', 'top-0', 'text-xs', 'text-indigo-400');
    label.classList.add('top-3', 'text-gray-400', 'text-sm');
  }

function updateBottomNavForEditMode(isEditing) {
  const nav = document.querySelector("nav");
  const addTab = document.querySelector('[data-tab="add"]');
  const dashTab = document.querySelector('[data-tab="dashboard"]');
  const histTab = document.querySelector('[data-tab="history"]');
  const settingsBtn = document.querySelector('[data-tab="settings"]');
  
  if (!addTab) return;
  
  if (isEditing) {
    // Hide other tabs and settings button
    if (dashTab) dashTab.style.display = "none";
    if (histTab) histTab.style.display = "none";
    if (settingsBtn) settingsBtn.style.display = "none";
    
    // Change Add button to Save button
    addTab.style.flex = "1";
    addTab.innerHTML = `
      <div class="flex flex-col items-center gap-1">
        <svg class="w-10 h-10" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">

        </svg>
        <span class="text-sm">Save Changes</span>
      </div>
    `;
  } else {
    // Restore all tabs and settings button
    if (dashTab) dashTab.style.display = "block";
    if (histTab) histTab.style.display = "block";
    if (settingsBtn) settingsBtn.style.display = "block";
    
    // Restore Add button
    addTab.style.flex = "1";

      <div class="flex flex-col items-center gap-1">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M12 4v16m8-8H4"/>

        <span>Add</span>

    `;
  }
}

function switchTab(tab) {
  // Dismiss any open bottom-sheets/overlays before changing pages
  document.querySelectorAll('[id$="Sheet"],[id$="Overlay"]').forEach(el => el.remove());

  // Save form data when leaving add tab (only if NOT in edit mode)
  if (activeTab === "add" && tab !== "add") {
    if (editModeRecord) {
      // Cancel edit mode - clear everything
      editModeRecord = null;
      savedFormData = null;
      updateBottomNavForEditMode(false);
    } else {
      if (skipNextAddFormSave) {
        skipNextAddFormSave = false;
        savedFormData = null;
      } else {
        // Normal tab switch - save form data
        const form = $("incomeForm");
        if (form) {
          savedFormData = {
            date: form.date?.value || "",
            hours: form.hours?.value || "",
            location: form.location?.value || "",
            rate: form.rate?.value || "",
            tips: form.tips?.value || "",
            payType: form.payType?.value || "hourly"
          };
        }
      }
    }
  }
  
  activeTab = tab;
  document.querySelectorAll(".tab").forEach(b => {
    b.classList.toggle("text-indigo-400", b.dataset.tab === tab);
    b.classList.toggle("text-gray-400", b.dataset.tab !== tab);
  });

  // Show/hide monthly banner based on tab
  const banner = $("monthlyBanner");
  if (banner) {
    banner.classList.toggle("hidden", tab !== "history");
  }

  // Add transition effect
  const app = $("app");
  app.style.opacity = "0";
  app.style.transform = "translateX(20px)";
  app.style.transition = "opacity 0.2s, transform 0.2s";
  
  setTimeout(() => {
    if (tab === "dashboard") renderDashboard();
    else if (tab === "add") renderAdd(editModeRecord || savedFormData);
    else if (tab === "history") renderHistory();
    else if (tab === "settings") renderSettings();
    
    // Restore visibility with animation
    app.style.opacity = "1";
    app.style.transform = "translateX(0)";
  }, 150);
}

function getDashboardFilteredRecords(records) {
  const df = dashboardDateFilter;
  if (!df || df.type === 'all') return records;

  const today = new Date();
  const currentYear = today.getFullYear();
  const currentMonth = today.getMonth();
  let startDate, endDate;

  if (df.type === 'month') {
    startDate = new Date(currentYear, currentMonth, 1);
    endDate = new Date(currentYear, currentMonth + 1, 0);
  } else if (df.type === 'ytd') {
    startDate = new Date(currentYear, 0, 1);
    endDate = today;
  } else if (df.type === 'past3months') {
    startDate = new Date(currentYear, currentMonth - 3, 1);
    endDate = today;
  } else if (df.type === 'range' && df.startDate && df.endDate) {
    startDate = new Date(df.startDate);
    endDate = new Date(df.endDate);
  } else {
    return records;
  }

  const startStr = startDate.toISOString().split('T')[0];
  const endStr = endDate.toISOString().split('T')[0];
  return records.filter(r => {
    const d = r._virtualDate || r.date;
    return d >= startStr && d <= endStr;
  });
}

function renderDashboard() {
  const data = loadData();
  const records = expandRecurringEntries(data.records.filter(r => !r.deleted));
  const defs = data.customFields || [];

  // Apply dashboard date + custom filters
  const dateFiltered = getDashboardFilteredRecords(records);
  const filtered = applyCustomFilters(dateFiltered, defs, dashboardFilters);

  // Hero stats
  const heroTotal  = filtered.reduce((sum, r) => sum + calculateRecordTotal(r, defs), 0);
  const heroHours  = filtered.reduce((sum, r) => sum + (parseFloat(r.hours) || 0), 0);
  const heroShifts = filtered.length;

  // vs-last-month comparison (only when showing "This Month")
  let changeHtml = '';
  if (dashboardDateFilter.type === 'month') {
    const today = new Date();
    const prevMonthStr = new Date(today.getFullYear(), today.getMonth() - 1, 1).toISOString().slice(0, 7);
    const prevTotal = applyCustomFilters(
      records.filter(r => r.date && r.date.startsWith(prevMonthStr)),
      defs, dashboardFilters
    ).reduce((sum, r) => sum + calculateRecordTotal(r, defs), 0);
    const change = prevTotal > 0 ? ((heroTotal - prevTotal) / prevTotal * 100).toFixed(0) : 0;
    const isUp = change >= 0;
    changeHtml = `<div class="text-center text-sm ${isUp ? 'text-green-400' : 'text-red-400'}">${isUp ? '↑' : '↓'} ${Math.abs(change)}% vs last month</div>`;
  }

  // Top locations from filtered set
  const locationTotals = {};
  filtered.forEach(r => {
    locationTotals[r.location] = (locationTotals[r.location] || 0) + calculateRecordTotal(r, defs);
  });
  const topLocations = Object.entries(locationTotals).sort((a, b) => b[1] - a[1]).slice(0, 5);

  const activeFilters = countActiveCustomFilters(dashboardFilters);

  $("app").innerHTML = `
    <div class="p-4 space-y-4">

      <!-- Date badge + filter icon row -->
      <div class="flex items-center justify-between pt-1">
        <button onclick="showDashboardDatePicker()"
          class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold"
          style="background:rgba(99,102,241,0.1);border:1px solid rgba(99,102,241,0.22);color:#818cf8;">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          <span>${dashboardDateFilter.label}</span>
          <svg width="9" height="9" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2.5 4.5L6 8l3.5-3.5"/></svg>
        </button>

        <button onclick="showDashboardFilterMenu()"
          class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold"
          style="background:${activeFilters ? 'rgba(99,102,241,0.12)' : 'rgba(255,255,255,0.04)'};border:1px solid ${activeFilters ? 'rgba(99,102,241,0.30)' : 'rgba(255,255,255,0.08)'};color:${activeFilters ? '#818cf8' : '#6b7280'};">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
          </svg>
          ${activeFilters ? `<span class="text-[11px]">${activeFilters}</span>` : ''}
        </button>
      </div>

      <!-- Hero total -->
      <div class="text-center text-4xl font-bold">${money(heroTotal)}</div>
      ${changeHtml}

      <!-- Stats grid -->
      <div class="grid grid-cols-3 gap-2">
        <div class="bg-gray-800 rounded p-3 text-center">
          <div class="text-gray-400 text-xs">Shifts</div>
          <div class="text-lg font-bold">${heroShifts}</div>
        </div>
        <div class="bg-gray-800 rounded p-3 text-center">
          <div class="text-gray-400 text-xs">Avg/Shift</div>
          <div class="text-lg font-bold">${heroShifts ? money(heroTotal / heroShifts) : '$0'}</div>
        </div>
        <div class="bg-gray-800 rounded p-3 text-center">
          <div class="text-gray-400 text-xs">Avg/Hour</div>
          <div class="text-lg font-bold">${heroHours ? money(heroTotal / heroHours) : '$0'}</div>
        </div>
      </div>

      ${heroHours > 0 ? `
      <div class="bg-gray-800 rounded p-4 text-center">
        <div class="text-gray-400 text-xs mb-1">Total Hours</div>
        <div class="text-2xl font-bold">${heroHours.toFixed(1)}</div>
      </div>
      ` : ''}

      <!-- Top Locations -->
      ${topLocations.length > 0 ? `
      <div class="bg-gray-800 rounded p-4">
        <div class="text-gray-400 text-xs mb-2">Top Locations</div>
        ${topLocations.map(([loc, total]) => `
          <div class="flex justify-between py-1 border-b border-gray-700 last:border-0">
            <span>${loc}</span>
            <span class="font-bold">${money(total)}</span>
          </div>
        `).join("")}
      </div>
      ` : ''}

      <!-- Analytics / Charts -->
      <div class="bg-gray-800 rounded p-4">
        <div class="text-gray-400 text-xs mb-3">Analytics</div>
        ${renderChartControls()}
        <div id="chartContainers" class="relative" style="min-height: 180px;">
          <div id="locationPieChart" class="w-full"></div>
          <div id="tipsVsHourlyChart" class="w-full hidden"></div>
          <div id="dailyIncomeChart" class="w-full hidden"></div>
          <div id="hoursByLocationChart" class="w-full hidden"></div>
          <div id="customChartDisplay" class="w-full hidden"></div>
        </div>
      </div>

    </div>
  `;

  renderAllCharts();
}

function setDashboardDateFilter(type, start, end, label) {
  dashboardDateFilter = { type, startDate: start, endDate: end, label };
  closeDashDatePicker();
  renderDashboard();
}

function showDashboardCustomRangePicker() {
  closeDashDatePicker();
  const today = new Date().toISOString().split('T')[0];
  const twoWeeksAgo = new Date();
  twoWeeksAgo.setDate(twoWeeksAgo.getDate() - 14);
  const twoWeeksAgoStr = twoWeeksAgo.toISOString().split('T')[0];
  const startVal = dashboardDateFilter.type === 'range' ? (dashboardDateFilter.startDate || twoWeeksAgoStr) : twoWeeksAgoStr;
  const endVal   = dashboardDateFilter.type === 'range' ? (dashboardDateFilter.endDate   || today) : today;

  const menu = `
    <div id="dashDateOverlay" class="fixed inset-0 bg-black/50 z-40" onclick="closeDashDatePicker()"></div>
    <div id="dashDateSheet" class="fixed bottom-20 inset-x-0 bg-gray-900 rounded-t-xl p-4 z-50 transform transition-transform duration-300 translate-y-full">
      <div class="text-lg font-bold mb-4">Custom Range</div>
      <div class="space-y-4">
        <div>
          <label class="text-sm text-gray-400">Start Date</label>
          <input type="date" id="dashRangeStart" value="${startVal}" class="w-full p-3 mt-1 bg-transparent text-gray-100 appearance-none border border-gray-700 rounded">
        </div>
        <div>
          <label class="text-sm text-gray-400">End Date</label>
          <input type="date" id="dashRangeEnd" value="${endVal}" class="w-full p-3 mt-1 bg-transparent text-gray-100 appearance-none border border-gray-700 rounded">
        </div>
        <button onclick="applyDashboardCustomRange()" class="w-full bg-indigo-600 p-3 rounded font-semibold">Apply</button>
      </div>
      <button onclick="closeDashDatePicker()" class="w-full bg-gray-700 p-3 rounded mt-4">Cancel</button>
    </div>
  `;

  const existing = $('dashDateSheet');
  if (existing) existing.remove();
  document.body.insertAdjacentHTML('beforeend', menu);
  requestAnimationFrame(() => {
    const sheet = $('dashDateSheet');
    if (sheet) sheet.classList.remove('translate-y-full');
  });
}

function applyDashboardCustomRange() {
  const start = $('dashRangeStart')?.value;
  const end   = $('dashRangeEnd')?.value;
  if (start && end) {
    const fmt = d => { const [y, m, day] = d.split('-'); return `${m}/${day}/${y.slice(2)}`; };
    setDashboardDateFilter('range', start, end, `${fmt(start)} – ${fmt(end)}`);
  }
}

/* ================================
   CUSTOM CHARTS
================================= */
const CUSTOM_CHARTS_KEY = 'll_custom_charts';

function loadCustomCharts() {
  try { return JSON.parse(localStorage.getItem(CUSTOM_CHARTS_KEY) || '[]'); } catch { return []; }
}

function saveCustomChartsToStorage(charts) {
  localStorage.setItem(CUSTOM_CHARTS_KEY, JSON.stringify(charts));
}

function saveCustomChart(cfg) {
  const charts = loadCustomCharts().filter(c => c.id !== cfg.id);
  charts.push(cfg);
  saveCustomChartsToStorage(charts.slice(0, 2));
}

function deleteCustomChart(id) {
  saveCustomChartsToStorage(loadCustomCharts().filter(c => c.id !== id));
  if (window.currentChartView === 'custom_' + id) {
    window.currentChartView = 'pie';
  }
  renderDashboard();
}

  const existing = editId ? loadCustomCharts().find(c => c.id === editId) : null;
  const data = loadData();
  const defs = (data.customFields || []).filter(d => d && (d.type === 'text' || d.type === 'date'));

    { v: 'tips',      l: 'Tips' },
    { v: 'base',      l: 'Base Pay' },
    { v: 'hours',     l: 'Hours' },
    { v: 'count',     l: 'Shift Count' },
    { v: 'avg_shift', l: 'Avg per Shift' },
    { v: 'avg_hour',  l: 'Avg per Hour' },
  ];

  const groupOptions = [
    { v: 'location',  l: 'Location' },
    { v: 'month',     l: 'Month' },
    { v: 'week',      l: 'Week' },
    { v: 'dayofweek', l: 'Day of Week' },
    ...defs.map(d => ({ v: 'custom_' + d.key, l: d.label })),

  const curMetric  = existing?.metric  || 'total';

  const html = `

      <div class="flex items-center justify-between mb-4">
        <div class="text-lg font-bold">${existing ? 'Edit' : 'New'} Custom Chart</div>
        <button onclick="closeAddChartSheet()" class="text-gray-400 text-xl leading-none">&times;</button>
      </div>

      <div class="space-y-4">
        <div>
          <div class="text-xs text-gray-400 mb-1">Button Label</div>
          <input id="cc_label" type="text" maxlength="18" placeholder="e.g. My Chart" value="${curLabel}"
            class="w-full p-3 bg-gray-800 rounded text-gray-100 text-sm">
        </div>

        <div>
          <div class="text-xs text-gray-400 mb-1">Metric</div>
          <div class="grid grid-cols-2 gap-2">
            ${metricOptions.map(o => `
              <label class="flex items-center gap-2 bg-gray-800 rounded p-2 cursor-pointer">
                <input type="radio" name="cc_metric" value="${o.v}" ${o.v === curMetric ? 'checked' : ''} class="accent-violet-500">
                <span class="text-sm text-gray-200">${o.l}</span>
              </label>
            `).join('')}
          </div>
        </div>

        <div>
          <div class="text-xs text-gray-400 mb-1">Group By</div>
          <select id="cc_group" class="w-full p-3 bg-gray-800 rounded text-gray-100 text-sm">
            ${groupOptions.map(o => `<option value="${o.v}" ${o.v === curGroup ? 'selected' : ''}>${o.l}</option>`).join('')}

        <button onclick="applyAddCustomChart('${newId}')"
          class="w-full p-3 rounded font-semibold text-white"
          style="background:linear-gradient(135deg,#7c3aed,#6366f1)">
          ${existing ? 'Update Chart' : 'Add Chart'}
        </button>

        ${existing ? `<button onclick="deleteCustomChart('${existing.id}')" class="w-full p-3 rounded bg-red-900/50 text-red-400">Delete Chart</button>` : ''}

  if (prev) { prev.previousElementSibling?.remove(); prev.remove(); }
  document.body.insertAdjacentHTML('beforeend', html);
  requestAnimationFrame(() => {
    $('addChartSheet')?.classList.remove('translate-y-full');

function closeAddChartSheet() {
  const sheet = $('addChartSheet');
  const overlay = $('addChartOverlay');
  if (sheet) sheet.classList.add('translate-y-full');
  if (overlay) overlay.classList.add('opacity-0');
  setTimeout(() => { overlay?.remove(); sheet?.remove(); }, 300);
}

function applyAddCustomChart(id) {
  const label = ($('cc_label')?.value || '').trim();
  if (!label) { alert('Please enter a label.'); return; }
  const metric  = document.querySelector('input[name="cc_metric"]:checked')?.value || 'total';
  const groupBy = $('cc_group')?.value || 'location';

  const metricLabels = { total:'Total Income', tips:'Tips', base:'Base Pay', hours:'Hours', count:'Shifts', avg_shift:'Avg/Shift', avg_hour:'Avg/Hour' };
  const metricLabel = metricLabels[metric] || metric;

  saveCustomChart({ id, label, metric, groupBy, metricLabel });
  closeAddChartSheet();
  window.currentChartView = 'custom_' + id;
  renderDashboard();
}

/* ================================
   ADD FORM WITH LOCATION INTELLIGENCE
================================= */
function renderAdd(existing = null) {
  const data = loadData();
  
  // Use existing record (edit mode) OR saved form data, OR defaults
  // Check if existing has an id (actual record) vs just being saved form data
  let r;
  let isEditMode = false;
  
  if (existing && existing.id && typeof existing.id === 'string' && existing.id.startsWith('income_')) {
    // Editing an existing record - has a valid record ID
    isEditMode = true;
    editModeRecord = existing;
    r = existing;
    // Load recurring state from the record so the edit form reflects current settings
    if (existing.type === "recurring") {
      _recurringEnabled = true;
      _recurringFreq    = existing.recurringFreq || 7;
      _recurringEnd     = existing.recurringEnd  || "";
    } else {
      _recurringEnabled = false;
    }
  } else if (savedFormData) {
    // Restoring saved form data when switching back to add tab
    r = { date: savedFormData.date || todayISO(), hours: savedFormData.hours || "", rate: savedFormData.rate || "", tips: savedFormData.tips || "", location: savedFormData.location || "", payType: savedFormData.payType || "hourly" };
    savedFormData = null; // Clear after use
  } else {
    // Fresh form
    editModeRecord = null;
    r = { date: todayISO(), hours: "", rate: "", tips: "", location: "", payType: "hourly" };
  }

  // Update bottom nav for edit mode
  updateBottomNavForEditMode(isEditMode);

  const recurFreqLabel = _recurringFreq === 1 ? '1d' : _recurringFreq === 7 ? '7d' : _recurringFreq === 14 ? '14d' : _recurringFreq === 30 ? '30d' : _recurringFreq === 91 ? '91d' : (_recurringFreq + 'd');

    <div class="relative">
      <input type="date" name="date" id="dateInput" value="${r.date}" class="w-full p-3 bg-transparent text-gray-100 box-border h-12 appearance-none peer" tabindex="1" oninput="updateLabel('dateLabel')">
      <label id="dateLabel" for="dateInput" class="absolute left-3 top-3 text-gray-400 text-sm pointer-events-none transition-all duration-200 ${r.date ? 'top-0 text-xs text-indigo-400' : ''}">Date</label>

      <label id="hoursLabel" for="hoursInput" class="absolute left-3 top-3 text-gray-400 text-sm pointer-events-none transition-all duration-200 ${r.hours != null && r.hours !== '' ? 'top-0 text-xs text-indigo-400 -translate-y-2' : ''}">Hours Worked</label>
    </div>

      <div class="flex items-center gap-2">
        <div class="flex-1 relative">
          <input type="number" step="0.01" inputmode="decimal" name="rate" id="rateInput"
            value="${r.rate ?? ''}" class="w-full p-3 bg-gray-800 rounded peer" oninput="updateLabel('rateLabel')" placeholder=" ">
          <label id="rateLabel" for="rateInput" class="absolute left-3 top-3 text-gray-400 text-sm pointer-events-none transition-all duration-200 ${r.rate != null && r.rate !== '' ? 'top-0 text-xs text-indigo-400 -translate-y-2' : ''}">${(r.payType === 'flat') ? 'Flat Amount' : 'Hourly Rate'}</label>
        </div>
        <button type="button" onclick="setPayType('hourly')" class="text-xs px-2 py-2 rounded ${r.payType !== 'flat' ? 'bg-indigo-600 text-white' : 'bg-gray-700 text-gray-300'}">Hourly</button>
        <button type="button" onclick="setPayType('flat')" class="text-xs px-2 py-2 rounded ${r.payType === 'flat' ? 'bg-indigo-600 text-white' : 'bg-gray-700 text-gray-300'}">Flat</button>
      </div>
    </div>

    <div class="relative">
      <input type="number" step="0.01" inputmode="decimal" name="tips" id="tipsInput"
        value="${r.tips ?? ''}" class="w-full p-3 bg-gray-800 rounded peer" oninput="updateLabel('tipsLabel')" placeholder=" ">
      <label id="tipsLabel" for="tipsInput" class="absolute left-3 top-3 text-gray-400 text-sm pointer-events-none transition-all duration-200 ${r.tips != null && r.tips !== '' ? 'top-0 text-xs text-indigo-400 -translate-y-2' : ''}">Tips</label>
    </div>

    <!-- Custom Fields Section -->
    <div id="customFieldsSection" class="space-y-3 pt-2 border-t border-gray-700">
      <!-- Custom fields will be rendered here -->
    </div>

    <!-- Add Custom Field Button -->
    <button type="button" onclick="showAddCustomFieldMenu()" class="w-full bg-gray-800 py-2 rounded text-sm text-gray-400 hover:text-white">
      + Add Custom Field
    </button>

    <button type="submit" class="w-full bg-indigo-600 py-3 rounded font-semibold">
      ${isEditMode ? "Update Entry" : "Add Entry"}
    </button>
  </form>
  `;

  setupCustomFields();
  setupLocationAutocomplete();
  setTimeout(() => setPayType(r.payType || 'hourly', true), 0);

  // Initialize labels based on existing values
  setTimeout(() => {
    if ($("dateInput")?.value) updateLabel('dateLabel');
    if ($("hoursInput")?.value) updateLabel('hoursLabel');
    if ($("locationInput")?.value) updateLabel('locationLabel');
    if ($("rateInput")?.value) updateLabel('rateLabel');
    if ($("tipsInput")?.value) updateLabel('tipsLabel');
    // Populate recurring start badge if enabled
    if (_recurringEnabled && $("dateInput")?.value) {
      _updateRecurStartBadge($("dateInput").value);
    }
  }, 50);

  $("incomeForm").onsubmit = e => {
    e.preventDefault();
    saveIncome(new FormData(e.target), editModeRecord);
  };
}

  document.body.insertAdjacentHTML('beforeend', `
    <div id="recurPopupOverlay" class="fixed inset-0 bg-black/60 z-50" onclick="closeRecurringPopup()"></div>
    <div id="recurPopupSheet" class="fixed bottom-20 inset-x-3 bg-gray-900 rounded-2xl p-5 z-50 shadow-2xl border border-gray-700/60 space-y-4 transform transition-transform duration-200 translate-y-4 opacity-0">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          ${_recurSvg('w-4 h-4 text-purple-400')}
          <span class="font-semibold text-white">Recurring</span>
        </div>
        <span class="text-xs text-gray-400">Repeats every…</span>
      </div>

      <div class="flex gap-2 flex-wrap" id="recurPopupFreqBtns">
        ${freqOptions.map(([d, lbl]) => `
          <button type="button" onclick="setRecurringFreqPopup(${d})"
            class="text-xs px-3 py-2 rounded-lg font-medium ${_recurringFreq === d ? 'bg-purple-600 text-white' : 'bg-gray-700 text-gray-300'}">
            ${lbl}
          </button>
        `).join('')}
        <button type="button" id="recurCustomBtn" onclick="toggleCustomFreqSliderPopup()"
          class="text-xs px-3 py-2 rounded-lg font-medium ${customActive ? 'bg-purple-600 text-white' : 'bg-gray-700 text-gray-300'}">
          custom
        </button>
      </div>

      <div id="recurCustomSliderRow" class="${customActive ? 'flex' : 'hidden'} items-center gap-3">
        <input type="range" min="1" max="30" value="${_recurringFreq}" step="1"
          oninput="setRecurringFreqPopup(parseInt(this.value))"
          class="flex-1 accent-purple-500">
        <span id="recurSliderVal" class="text-xs font-mono text-purple-300 w-8 text-right">${_recurringFreq}d</span>
      </div>

      <div class="space-y-2">
        <div class="text-xs text-gray-400">Ends (optional — defaults to 2 years from start)</div>
        <input type="date" id="recurEndInputPopup" value="${_recurringEnd}"
          oninput="_recurringEnd=this.value"
          class="w-full p-2 bg-gray-800 rounded text-sm text-gray-200">
      </div>

      <button type="button" onclick="closeRecurringPopup()"
        class="w-full bg-purple-600 hover:bg-purple-500 py-2.5 rounded-xl text-sm font-semibold text-white flex items-center justify-center gap-2">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        Set Recurring
      </button>
    </div>
  `);

  // Animate in
  requestAnimationFrame(() => {
    const sheet = document.getElementById('recurPopupSheet');
    if (sheet) {
      sheet.classList.remove('translate-y-4', 'opacity-0');
    }
  });
}

function closeRecurringPopup() {
  const overlay = document.getElementById('recurPopupOverlay');
  const sheet   = document.getElementById('recurPopupSheet');
  if (sheet) {
    sheet.classList.add('translate-y-4', 'opacity-0');
    setTimeout(() => { overlay?.remove(); sheet?.remove(); }, 180);
  } else {
    overlay?.remove();
  }
  // Update toggle button (new entry) or edit-mode banner (recurring template edit)
  if (document.getElementById('editRecurBanner')) {
    _updateEditRecurBanner();
  } else {
    updateRecurToggleBtn();
  }
}

function _updateEditRecurBanner() {
  const fl = document.getElementById('editRecurFreqLabel');
  const el = document.getElementById('editRecurEndLabel');
  const recurFreqLabel = _recurringFreq === 1 ? '1d' : _recurringFreq === 7 ? '7d' : _recurringFreq === 14 ? '14d' : _recurringFreq === 30 ? '30d' : _recurringFreq === 91 ? '91d' : (_recurringFreq + 'd');
  if (fl) fl.textContent = 'Recurring · every ' + recurFreqLabel;
  if (el) el.textContent = 'Ends: ' + (_recurringEnd || 'auto (2 yrs from start)');
}

function disableRecurring() {
  _recurringEnabled = false;
  _recurringFreq    = 7;
  _recurringEnd     = "";
  updateRecurToggleBtn();
}

function updateRecurToggleBtn() {
  const btn = document.getElementById('recurToggleBtn');
  if (!btn) return;
  const recurFreqLabel = _recurringFreq === 1 ? '1d' : _recurringFreq === 7 ? '7d' : _recurringFreq === 14 ? '14d' : _recurringFreq === 30 ? '30d' : _recurringFreq === 91 ? '91d' : (_recurringFreq + 'd');
  const iconSvg = _recurSvg('w-3 h-3');
  if (_recurringEnabled) {
    btn.setAttribute('onclick', 'disableRecurring()');
    btn.className = 'text-xs px-2 py-1 rounded flex items-center gap-1 bg-purple-600 text-white';
    btn.innerHTML = iconSvg + ' ' + recurFreqLabel + ' ×';
  } else {
    btn.setAttribute('onclick', 'openRecurringPopup()');
    btn.className = 'text-xs px-2 py-1 rounded flex items-center gap-1 bg-gray-700 text-gray-300';
    btn.innerHTML = iconSvg + ' Recurring';
  }
}

function setRecurringFreqPopup(days) {
  _recurringFreq = days;
  // Update button highlights in popup
  document.querySelectorAll('#recurPopupFreqBtns button').forEach(btn => {
    const m = btn.getAttribute('onclick')?.match(/setRecurringFreqPopup\((\d+)\)/);
    const btnDays = m ? parseInt(m[1]) : -1;
    const isCustom = btn.id === 'recurCustomBtn';
    const isActive = isCustom
      ? ![1, 7, 14, 30, 91].includes(days)
      : btnDays === days;
    btn.classList.toggle('bg-purple-600', isActive);
    btn.classList.toggle('text-white', isActive);
    btn.classList.toggle('bg-gray-700', !isActive);
    btn.classList.toggle('text-gray-300', !isActive);
  });
  // Update custom slider display
  const sv = document.getElementById('recurSliderVal');
  if (sv) sv.textContent = days + 'd';
  const slider = document.querySelector('#recurCustomSliderRow input[type="range"]');
  if (slider) slider.value = days;
}

function toggleCustomFreqSliderPopup() {
  const row = document.getElementById('recurCustomSliderRow');
  if (!row) return;
  const isHidden = row.classList.contains('hidden');
  row.classList.toggle('hidden', !isHidden);
  if (isHidden) {
    const slider = row.querySelector('input[type="range"]');
    if (slider) setRecurringFreqPopup(parseInt(slider.value));
  }
}

function toggleRecurring() {
  // Legacy: just toggle off if on, or open popup if off
  if (_recurringEnabled) {
    disableRecurring();
  } else {
    openRecurringPopup();
  }
}

/* ================================
   RECURRING ENTRY EXPANSION
================================= */

/**
 * Expands recurring template records into virtual instances.
 * Virtual records carry `_isVirtual: true`, `_originalId`, and `_virtualDate`.
 * The templates themselves are excluded from the output.
 *
 * @param {Array} records - non-deleted records (already filtered by r.deleted)
 * @returns {Array} expanded records (virtuals interleaved with normal records)
 */
function expandRecurringEntries(records) {
  const today = todayISO();
  const result = [];

  records.forEach(r => {
    if (r.type !== "recurring") {
      result.push(r);
      return;
    }
    // Generate virtual instances from startDate to min(endDate || startDate+2yr, today)
    const startDate = r.date;
    let endDate = r.recurringEnd;
    if (!endDate) {
      // default: 2 years from start
      const start = new Date(startDate);
      start.setFullYear(start.getFullYear() + 2);
      endDate = start.toISOString().split("T")[0];
    }
    const cap = endDate < today ? endDate : today;
    const freq = parseInt(r.recurringFreq) || 7;

    // The template itself represents the start-date occurrence — push as-is
    if (startDate <= cap) {
      result.push(r);
    }

    // Subsequent occurrences are virtual (startDate + freq, +2*freq, …)
    let cur = new Date(startDate);
    cur.setDate(cur.getDate() + freq);
    let safety = 0;
    while (safety++ < 1000) {
      const curStr = cur.toISOString().split("T")[0];
      if (curStr > cap) break;
      result.push({
        ...r,
        _isVirtual: true,
        _originalId: r.id,
        _originalCreatedAt: r.createdAt,
        _virtualDate: curStr,
        date: curStr,
      });
      cur.setDate(cur.getDate() + freq);
    }
  });

  return result;
}

function setPayType(type, silent = false) {
  const payType = (type === "flat") ? "flat" : "hourly";
  const input = $("payTypeInput");
  if (input) input.value = payType;
  const label = $("rateLabel");
  if (label) label.textContent = payType === "flat" ? "Flat Amount" : "Hourly Rate";
  // Refresh buttons by re-rendering only if not silent (keeps UI consistent)
  if (!silent) {
    // Lightweight button state update
    const buttons = document.querySelectorAll('button[onclick^="setPayType"]');
    buttons.forEach(b => {
      const isFlatBtn = b.getAttribute("onclick")?.includes("'flat'");
      const active = (payType === "flat") === isFlatBtn;
      b.classList.toggle("bg-indigo-600", active);
      b.classList.toggle("text-white", active);
      b.classList.toggle("bg-gray-700", !active);
      b.classList.toggle("text-gray-300", !active);
    });
  }
}

function setupCustomFields() {
  const section = $("customFieldsSection");
  if (!section) return;
  
  const data = loadData();
  const customFields = data.customFields || [];
  
  if (customFields.length === 0) {
    section.innerHTML = '';
    return;
  }
  
  section.innerHTML = customFields.map((field, index) => {
    const fieldId = `custom_${index}`;
    const existingValue = editModeRecord ? (editModeRecord[field.key] ?? '') : '';
    const hasValue = existingValue !== '' && existingValue != null;
    
    if (field.type === 'checkbox') {
      return `
        <div class="flex items-center gap-2">
          <input type="checkbox" name="${fieldId}" id="${fieldId}" ${existingValue === 'true' ? 'checked' : ''} class="w-5 h-5 accent-indigo-500 bg-gray-800 rounded border border-gray-600" onchange="updateCustomFieldLabel('${fieldId}')">
          <label for="${fieldId}" class="text-gray-300 select-none">${field.label}</label>
        </div>
      `;
    } else if (field.type === 'number') {
      return `
        <div class="relative">
          <input type="number" inputmode="numeric" name="${fieldId}" id="${fieldId}" value="${existingValue}"
            class="w-full p-3 bg-gray-800 rounded peer" placeholder=" " oninput="updateCustomFieldLabel('${fieldId}')">
          <label id="${fieldId}_label" for="${fieldId}" class="absolute left-3 top-3 text-gray-400 text-sm pointer-events-none transition-all duration-200 ${hasValue ? '-translate-y-2 top-0 text-xs text-indigo-400' : ''}">${field.label}</label>
        </div>
      `;
    } else if (field.type === 'money') {
      return `
        <div class="relative">
          <div class="absolute left-3 top-3 text-gray-400 text-sm pointer-events-none">$</div>
          <input type="number" step="0.01" inputmode="decimal" name="${fieldId}" id="${fieldId}" value="${existingValue}"
            class="w-full p-3 pl-8 bg-gray-800 rounded peer" placeholder=" " oninput="updateCustomFieldLabel('${fieldId}')">
          <label id="${fieldId}_label" for="${fieldId}" class="absolute left-8 top-3 text-gray-400 text-sm pointer-events-none transition-all duration-200 ${hasValue ? '-translate-y-2 top-0 text-xs text-indigo-400' : ''}">${field.label}</label>
        </div>
      `;
    } else if (field.type === 'date') {
      return `
        <div class="relative">
          <input type="date" name="${fieldId}" id="${fieldId}" value="${existingValue}"
            class="w-full p-3 bg-transparent text-gray-100 appearance-none" onchange="updateCustomFieldLabel('${fieldId}')">
          <label id="${fieldId}_label" for="${fieldId}" class="absolute left-3 top-3 text-gray-400 text-sm pointer-events-none transition-all duration-200 ${hasValue ? '-translate-y-2 top-0 text-xs text-indigo-400' : ''}">${field.label}</label>
        </div>
      `;
    } else if (field.type === 'longtext') {
      return `
        <div>
          <label class="text-xs text-gray-400 mb-1 block">${field.label}</label>
          <textarea name="${fieldId}" id="${fieldId}" rows="4"
            class="w-full p-3 bg-gray-800 rounded text-white text-sm resize-none" placeholder="Enter notes...">${existingValue ? String(existingValue).replace(/</g, '&lt;') : ''}</textarea>
        </div>
      `;
    } else {
      // Default to text input
      return `
        <div class="relative">
          <input type="text" name="${fieldId}" id="${fieldId}" value="${existingValue}"
            class="w-full p-3 bg-gray-800 rounded peer" placeholder=" " oninput="updateCustomFieldLabel('${fieldId}')">
          <label id="${fieldId}_label" for="${fieldId}" class="absolute left-3 top-3 text-gray-400 text-sm pointer-events-none transition-all duration-200 ${hasValue ? '-translate-y-2 top-0 text-xs text-indigo-400' : ''}">${field.label}</label>
        </div>
      `;
    }
  }).join('');
  
  // Initialize labels after render
  setTimeout(() => {
    customFields.forEach((field, index) => {
      const fieldId = `custom_${index}`;
      updateCustomFieldLabel(fieldId);
    });
  }, 50);
}

function updateCustomFieldLabel(fieldId) {
  const input = document.getElementById(fieldId);
  const label = document.getElementById(fieldId + '_label');
  if (!input || !label) return;
  
  const hasValue = input.type === 'checkbox' 
    ? input.checked 
    : (input.value && input.value.length > 0);
  
  if (hasValue) {
    label.classList.add('-translate-y-2', 'top-0', 'text-xs', 'text-indigo-400');
    label.classList.remove('top-3', 'text-gray-400', 'text-sm');
  } else {
    label.classList.remove('-translate-y-2', 'top-0', 'text-xs', 'text-indigo-400');
    label.classList.add('top-3', 'text-gray-400', 'text-sm');
  }
}

      <div class="text-lg font-bold mb-4">Add Custom Field</div>

          <div class="text-xs text-gray-400">Tie this field into Total</div>
          <div class="flex gap-2">
            <label class="flex-1 text-xs bg-gray-800 rounded p-2 cursor-pointer">
              <input type="radio" name="moneyAddToTotal" value="none" checked class="mr-2 accent-indigo-500">None
            </label>
            <label class="flex-1 text-xs bg-gray-800 rounded p-2 cursor-pointer">
              <input type="radio" name="moneyAddToTotal" value="add" class="mr-2 accent-indigo-500">Add
            </label>
            <label class="flex-1 text-xs bg-gray-800 rounded p-2 cursor-pointer">
              <input type="radio" name="moneyAddToTotal" value="subtract" class="mr-2 accent-indigo-500">Subtract
            </label>
          </div>
        </div>
        <button onclick="saveCustomField()" class="w-full bg-indigo-600 p-3 rounded">Add Field</button>
      </div>

    </div>
  `;
  
  const existing = $("customFieldSheet");
  if (existing) existing.remove();
  
  document.body.insertAdjacentHTML("beforeend", menu);
  
  requestAnimationFrame(() => {

    const overlay = $("customFieldOverlay");
    if (sheet) sheet.classList.remove("translate-y-full");
    if (overlay) overlay.classList.remove("opacity-0");
    toggleMoneyFieldOptions();
  });
}

function toggleMoneyFieldOptions() {
  const type = $("customFieldType")?.value;
  const options = $("moneyFieldOptions");
  if (!options) return;
  options.classList.toggle("hidden", type !== "money");
}

function closeCustomFieldMenu() {
  const sheet = $("customFieldSheet");
  const overlay = $("customFieldOverlay");
  
  if (sheet) sheet.classList.add("translate-y-full");
  if (overlay) overlay.classList.add("opacity-0");
  
  setTimeout(() => {
    if (overlay) overlay.remove();
    if (sheet) sheet.remove();
  }, 300);
}

function saveCustomField() {
  const name = $("customFieldName").value.trim();
  const type = $("customFieldType").value;
  
  if (!name) {
    showToast("Please enter a field name", 2000);
    return;
  }
  if (name.length > 24) {
    showToast("Field name must be 24 characters or less", 2500);
    return;
  }

  const data = loadData();
  if (!data.customFields) data.customFields = [];

  // Create field key (sanitized for storage)
  const fieldKey = "CustomField_" + name.replace(/[^a-zA-Z0-9]/g, "_");
  
  const addToTotal = type === "money"
    ? (document.querySelector('input[name="moneyAddToTotal"]:checked')?.value || "none")
    : undefined;

  data.customFields.push({
    label: name,
    type: type,
    key: fieldKey,
    ...(type === "money" ? { addToTotal } : {})
  });
  
  saveData(data);
  closeCustomFieldMenu();
  showToast(`Added "${name}" field`, 2000);
  
  // Re-render the add form to show new field
  renderAdd(editModeRecord || savedFormData);
}

/* Location Autocomplete */
function setupLocationAutocomplete() {
  const data = loadData();
  const input = $("locationInput");
  const dropdown = $("locationDropdown");

  // Trigger label animation on input
  input.oninput = () => {
    updateLabel('locationLabel');
    
    const value = input.value.toLowerCase();
    const matches = Object.keys(data.locations)
      .filter(loc => loc.toLowerCase().includes(value));

    if (!value || matches.length === 0) {
      dropdown.classList.add("hidden");
      return;
    }

    dropdown.innerHTML = matches.map(m =>
      `<div class="p-2 hover:bg-gray-700 cursor-pointer">${m}</div>`
    ).join("");

    dropdown.classList.remove("hidden");

    dropdown.querySelectorAll("div").forEach(div => {
      div.onclick = () => {
        input.value = div.textContent;
        updateLabel('locationLabel');
        autoFillRate(div.textContent);
        dropdown.classList.add("hidden");
      };
    });
  };

  input.onblur = () => setTimeout(() => dropdown.classList.add("hidden"), 200);
}

/* Clear the form */
function clearForm() {
  savedFormData = null;
  editModeRecord = null;
  updateBottomNavForEditMode(false);
  
  const form = $("incomeForm");
  if (form) {
    form.reset();
    // Reset floating labels
    ['dateLabel', 'hoursLabel', 'locationLabel', 'rateLabel', 'tipsLabel'].forEach(id => {
      const label = document.getElementById(id);
      if (label) {
        label.classList.remove('-translate-y-2', 'top-0', 'text-xs', 'text-indigo-400');
        label.classList.add('top-3', 'text-gray-400', 'text-sm');
      }
    });
  }
  showToast("Form cleared", 1500);
}

/* Auto-fill rate based on last saved location rate */
function autoFillRate(location) {
  const data = loadData();
  if (data.locations[location]) {
    $("rateInput").value = data.locations[location].lastRate;
    updateLabel('rateLabel');
  }
}

function saveIncome(form, existing) {
  debug("saveIncome called - START");
  
  // Check localStorage is available
  try {
    localStorage.setItem("test", "test");
    localStorage.removeItem("test");
    debug("localStorage is available");
  } catch (e) {
    debug("ERROR: localStorage not available: " + e.message);
    showToast("localStorage not available!", 5000);
    return;
  }
  
  const data = loadData();
  const now = Date.now();

  const location = form.get("location");
  const rate = Number(form.get("rate"));
  const hoursRaw = form.get("hours");
  const hours = hoursRaw !== "" ? Number(hoursRaw) : null; // null = field left blank
  const tips = Number(form.get("tips"));
  const date = form.get("date");

  debug(`Form data: date=${date}, hours=${hoursRaw}, rate=${rate}, tips=${tips}, location=${location}`);

  // For recurring entries, rate must be > 0 but hours can be 0 (flat pay use case)
  const isRecurring = _recurringEnabled && !existing;
  if (!location || !rate || rate <= 0) {
    debug("ERROR: Missing required fields!");
    showToast("Please fill in rate and location", 3000);
    return;
  }
  if (!isRecurring && (hours === null || hours < 0)) {
    debug("ERROR: Missing or negative hours!");
    showToast(hours !== null && hours < 0 ? "Hours cannot be negative" : "Please fill in hours, rate, and location", 3000);
    return;
  }

  debug("Validation passed, about to save location");

  // Ensure locations object exists
  if (!data.locations) {
    data.locations = {};
    debug("Initialized data.locations");
  }

  try {
    if (!data.locations[location]) {
      data.locations[location] = { lastRate: rate, preferredColor: null };
    } else {
      data.locations[location] = {
        ...data.locations[location],
        lastRate: rate
      };
    }
    debug("Location saved successfully");
  } catch (e) {
    debug("ERROR saving location: " + e.message);
    showToast("Error saving location: " + e.message, 5000);
    return;
  }

  debug(`Records before push: ${data.records.length}`);

  const tipsNum = Number(form.get("tips")) || 0;
  const payType = form.get("payType") === "flat" ? "flat" : "hourly";
  
  // Get custom field values - store with field.key as the key
  const customFields = data.customFields || [];
  const customFieldData = {};
  const clearedCustomKeys = []; // keys explicitly emptied — must be removed on edit
  customFields.forEach((field, index) => {
    const inputId = `custom_${index}`;
    let value = form.get(inputId);

    const input = document.getElementById(inputId);

    // Checkboxes: store 'true' when checked, remove the key when unchecked
    if (field.type === 'checkbox') {
      if (input && input.checked) {
        customFieldData[field.key] = 'true';
      } else {
        clearedCustomKeys.push(field.key);
      }
      return; // forEach continue
    }

    if (value !== null && value !== "") {
      customFieldData[field.key] = value;
    } else {
      clearedCustomKeys.push(field.key);
    }
  });

  if (existing) {
    // Use both id AND createdAt to find the exact record — prevents matching
    // a duplicate-ID record that was created before a meta reset.
    const recordIndex = existing.createdAt
      ? data.records.findIndex(r => r.id === existing.id && r.createdAt === existing.createdAt)
      : data.records.findIndex(r => r.id === existing.id);
    debug(`Updating record at index: ${recordIndex}, id: ${existing.id}`);
    
    if (recordIndex >= 0) {
      const updated = {
        ...data.records[recordIndex],
        date: form.get("date"),
        hours: hours,
        rate: rate,
        tips: tipsNum,
        location,
        payType,
        ...customFieldData,
        updatedAt: now
      };
      // Explicitly remove any custom fields the user cleared to empty
      clearedCustomKeys.forEach(k => delete updated[k]);
      // Preserve / update recurring schedule if editing a recurring template
      if (data.records[recordIndex].type === "recurring") {
        updated.type         = "recurring";
        updated.recurringFreq = _recurringFreq || data.records[recordIndex].recurringFreq;
        updated.recurringEnd  = _recurringEnd  || data.records[recordIndex].recurringEnd;
      }
      data.records[recordIndex] = updated;
    }
  } else {
    const newRec = {
      id: generateId(),
      date: form.get("date"),
      hours: hours,
      rate: rate,
      tips: tipsNum,
      location,
      payType,
      ...customFieldData,
      deleted: false,
      createdAt: now,
      updatedAt: now
    };
    if (isRecurring) {
      newRec.type = "recurring";
      newRec.recurringFreq = _recurringFreq;
      // Compute end date: user-supplied or startDate + 2 years
      if (_recurringEnd) {
        newRec.recurringEnd = _recurringEnd;
      } else {
        const startD = new Date(newRec.date);
        startD.setFullYear(startD.getFullYear() + 2);
        newRec.recurringEnd = startD.toISOString().split("T")[0];
      }
    }
    data.records.push(newRec);
    // Reset recurring state after save
    if (isRecurring) {
      _recurringEnabled = false;
      _recurringFreq    = 7;
      _recurringEnd     = "";
    }
  }

  try {
    saveData(data);
    showToast(editModeRecord ? "Entry updated! ✅" : "Entry added! ✅", 2000);
    
    // Clear edit mode and form data
    if (editModeRecord) {
      editModeRecord = null;
      savedFormData = null; // Clear saved form data too
      updateBottomNavForEditMode(false);
    }
  } catch (e) {
    showToast("Error saving data: " + e.message, 5000);
    return;
  }
  
  // Avoid persisting the just-submitted form values into savedFormData
  savedFormData = null;
  skipNextAddFormSave = true;
  editModeRecord = null;
  updateBottomNavForEditMode(false);
  switchTab("history");
}

/* Delete a record (soft delete) with confirmation */
function deleteRecord(id, createdAt) {
  const data = loadData();
  const record = createdAt
    ? data.records.find(r => r.id === id && r.createdAt === createdAt)
    : data.records.find(r => r.id === id);
  if (!record) return;
  
  // Show confirmation
  if (confirm('Delete this entry?')) {
    record.deleted = true;
    record.updatedAt = Date.now();
    saveData(data);
    showToast("Entry deleted", 2000);
    renderHistory();
  }
}

/* Restore a deleted record */
function restoreRecord(id, createdAt) {
  const data = loadData();
  const record = createdAt
    ? data.records.find(r => r.id === id && r.createdAt === createdAt)
    : data.records.find(r => r.id === id);
  if (record) {
    record.deleted = false;
    record.updatedAt = Date.now();
    saveData(data);
    showToast("Entry restored", 2000);
    renderHistory();
  }
}

/* Toggle showing deleted records */
function toggleDeletedRecords() {
  showDeletedRecords = !showDeletedRecords;
  renderHistory();
}

/* Edit a record */
function editRecord(id, createdAt) {
  debug("Editing record: " + id);
  const data = loadData();
  const record = createdAt
    ? data.records.find(r => r.id === id && r.createdAt === createdAt)
    : data.records.find(r => r.id === id);
  if (record) {
    switchTab("add");
    // Need to render add form with existing data
    setTimeout(() => renderAdd(record), 100);
  }
}

// Current date filter state (already defined globally)
dateFilter = {
  type: "all", // "all", "month", "range", "ytd", "past3months"
  startDate: null,
  endDate: null,
  label: "All Time"
};

function getFilteredRecords(records) {
  const today = new Date();
  const currentYear = today.getFullYear();
  const currentMonth = today.getMonth();
  
  let startDate, endDate;
  
  if (dateFilter.type === "month") {
    // Current month
    startDate = new Date(currentYear, currentMonth, 1);
    endDate = new Date(currentYear, currentMonth + 1, 0);
  } else if (dateFilter.type === "ytd") {
    startDate = new Date(currentYear, 0, 1);
    endDate = today;
  } else if (dateFilter.type === "past3months") {
    startDate = new Date(currentYear, currentMonth - 3, 1);
    endDate = today;
  } else if (dateFilter.type === "range" && dateFilter.startDate && dateFilter.endDate) {
    startDate = new Date(dateFilter.startDate);
    endDate = new Date(dateFilter.endDate);
  } else {
    // Default to current month
    startDate = new Date(currentYear, currentMonth, 1);
    endDate = new Date(currentYear, currentMonth + 1, 0);
  }
  
  const startStr = startDate.toISOString().split("T")[0];
  const endStr = endDate.toISOString().split("T")[0];
  
  return records.filter(r => {
    const d = r._virtualDate || r.date;
    return d >= startStr && d <= endStr;
  });
}

  const menu = `
    <div id="filterOverlay" class="fixed inset-0 bg-black/50 z-40 transition-opacity" onclick="closeFilterMenu()"></div>

      <div class="text-lg font-bold mb-4">Select Date Range</div>
      <div class="space-y-2">
        <button onclick="setDateFilter('all', null, null, 'All Time (Scroll)')" class="w-full bg-indigo-600 p-3 rounded text-left">📜 All Time (Infinite Scroll)</button>
        <button onclick="setDateFilter('month', null, null, 'This Month')" class="w-full bg-gray-800 p-3 rounded text-left">This Month</button>
        <button onclick="setDateFilter('ytd', null, null, 'Year to Date')" class="w-full bg-gray-800 p-3 rounded text-left">Year to Date</button>
        <button onclick="setDateFilter('past3months', null, null, 'Past 3 Months')" class="w-full bg-gray-800 p-3 rounded text-left">Past 3 Months</button>
        <button onclick="showCustomRangePicker()" class="w-full bg-gray-800 p-3 rounded text-left">Custom Range...</button>
      </div>

    </div>
  `;
  
  // Remove existing if any
  const existing = $("filterSheet");
  if (existing) existing.remove();
  
  document.body.insertAdjacentHTML("beforeend", menu);
  
  // Animate in
  requestAnimationFrame(() => {
    const sheet = $("filterSheet");
    const overlay = $("filterOverlay");
    if (sheet) sheet.classList.remove("translate-y-full");

function closeFilterMenu() {
  const sheet = $("filterSheet");
  const overlay = $("filterOverlay");
  
  // Animate out
  if (sheet) {
    sheet.classList.add("translate-y-full");
  }
  if (overlay) {
    overlay.classList.add("opacity-0");
  }
  
  setTimeout(() => {
    if (overlay) overlay.remove();
    if (sheet) sheet.remove();
  }, 300);
  
  // Reset arrow to point down
  const arrowEl = $("filterArrow");
  if (arrowEl) {
    arrowEl.style.transform = "rotate(0deg)";
  }
}
