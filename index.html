function renderHistory() {
  // Reset loaded months when entering history (only if not a scroll load)
  if (!isScrollLoad) {
    loadedMonths = 2;
  }
  isScrollLoad = false;
  
  const allData = loadData();
  const defs = allData.customFields || [];
  
  // Get all non-deleted records sorted by date (newest first)
  let records = showDeletedRecords
    ? allData.records.filter(r => r.deleted)
    : allData.records.filter(r => !r.deleted);

  // Expand recurring templates into virtual instances (before filtering)
  if (!showDeletedRecords) {
    records = expandRecurringEntries(records);
  }

  // Sort all records by date descending
  records = applyHistorySort(records, defs);
  
  // Store for scroll loading
  allRecords = records;
  
  // Check if we have a date filter active (not "All Time")
  const isFiltered = dateFilter && dateFilter.type !== 'all';
  
  // If filtered, calculate date range
  let startDate = null;
  let endDate = null;
  if (isFiltered) {
    const today = new Date();
    const currentYear = today.getFullYear();
    const currentMonth = today.getMonth();
    
    if (dateFilter.type === "month") {
      startDate = new Date(currentYear, currentMonth, 1);
      endDate = new Date(currentYear, currentMonth + 1, 0);
    } else if (dateFilter.type === "ytd") {
      startDate = new Date(currentYear, 0, 1);
      endDate = today;
    } else if (dateFilter.type === "past3months") {
      startDate = new Date(currentYear, currentMonth - 3, 1);
      endDate = today;
    } else if (dateFilter.type === "range" && dateFilter.startDate && dateFilter.endDate) {
      startDate = new Date(dateFilter.startDate);
      endDate = new Date(dateFilter.endDate);
    }
  }
  
  // Filter by date if range is set (use _virtualDate for virtual recurring entries)
  if (startDate && endDate) {
    const startStr = startDate.toISOString().split("T")[0];
    const endStr = endDate.toISOString().split("T")[0];
    records = records.filter(r => {
      const d = r._virtualDate || r.date;
      return d >= startStr && d <= endStr;
    });
  }

  // Apply custom field filters after date filtering
  records = applyCustomFilters(records, defs, historyFilters);

  // Re-apply sort after filtering (keeps order stable)
  records = applyHistorySort(records, defs);
  
  // Group all filtered records by month (use _virtualDate for virtual recurring entries)
  const byMonth = {};
  records.forEach(r => {
    const monthKey = (r._virtualDate || r.date).substring(0, 7); // "2026-02"
    if (!byMonth[monthKey]) byMonth[monthKey] = [];
    byMonth[monthKey].push(r);
  });
  
  // Get sorted month keys
  const months = Object.keys(byMonth).sort((a, b) => b.localeCompare(a));
  
  // Calculate totals for first loaded months (or all if filtered)
  let loadedRecords = [];
  if (isFiltered) {
    // If filtered, show all months at once
    loadedRecords = records;
  } else {
    // If not filtered (infinity), show one month at a time
    for (let i = 0; i < Math.min(loadedMonths, months.length); i++) {
      loadedRecords.push(...byMonth[months[i]]);
    }
  }
  
  const totalIncome = loadedRecords.reduce((sum, r) => sum + calculateRecordTotal(r, defs), 0);
  const totalTips = loadedRecords.reduce((sum, r) => sum + r.tips, 0);
  const totalHours = loadedRecords.reduce((sum, r) => sum + r.hours, 0);
  
  const formatDate = (isoDate) => {
    const [y, m, d] = isoDate.split("-");
    const date = new Date(y, m - 1, d);
    return date.toDateString();
  };

  const formatMonth = (monthKey) => {
    const [year, month] = monthKey.split('-');
    const date = new Date(year, month - 1, 1);
    return date.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  };

  // Calculate month totals for banner
  const monthTotals = {};
  months.forEach(m => {
    monthTotals[m] = byMonth[m].reduce((sum, r) => sum + calculateRecordTotal(r, defs), 0);
  });

  $("app").innerHTML = `
    <!-- Stats Summary -->
    <div class="p-4 space-y-2">
      <div class="flex justify-between items-center">
        <div class="text-center text-xs text-gray-400">${dateFilter.label}</div>
        <div class="flex items-center gap-3">
          <button onclick="showHistoryFilterMenu()" class="text-xs text-gray-400 hover:text-gray-200 flex items-center gap-2">
            <span>Filters</span>
            ${(() => {
              const n = countActiveCustomFilters(historyFilters);
              return n ? `<span class="text-[10px] bg-indigo-600/30 text-indigo-200 px-2 py-0.5 rounded-full">${n}</span>` : '';
            })()}
          </button>
          ${countActiveCustomFilters(historyFilters) ? `<button onclick="clearHistoryFiltersQuick()" class="text-[11px] text-gray-500 hover:text-gray-300">Clear</button>` : ''}
          <button onclick="toggleDeletedRecords()" class="text-xs ${showDeletedRecords ? 'text-red-400' : 'text-gray-500'}">
            ${showDeletedRecords ? '✓ Showing Deleted' : 'Show Deleted'}
          </button>
        </div>
      </div>
      ${!showDeletedRecords ? `
      <div class="text-2xl font-bold text-left">${money(totalIncome)}</div>
      <div class="flex justify-between text-sm">
        <span class="text-gray-400">${totalHours.toFixed(1)} hrs</span>
        <span class="text-gray-400">Tips: ${money(totalTips)}</span>
      </div>
      ` : ''}
    </div>
    
    <!-- Entries with infinite scroll -->
    <div id="historyList" class="p-4 space-y-6">
      ${months.slice(0, loadedMonths).map(month => `
        <div class="month-group" data-month="${month}" data-total="${monthTotals[month]}">
          <div class="text-xs uppercase text-gray-400 mb-2">
            ${formatMonth(month)} <span class="text-indigo-400">${money(monthTotals[month])}</span>
          </div>
          ${byMonth[month].map(r => {
            // Group by date within month
            const totalForShift = calculateRecordTotal(r, defs);
            const filledCustom = defs
              .filter(f => f && f.key)
              .map(f => ({ def: f, raw: r[f.key] }))
              .filter(x => {
                if (x.raw === null || x.raw === undefined || x.raw === "") return false;
                if (x.def.type === "checkbox") {
                  return x.raw === true || x.raw === "true" || x.raw === 1 || x.raw === "1";
                }
                return true;
              });

            const filledMoney = filledCustom.filter(x => x.def.type === 'money');
            const filledLongText = filledCustom.filter(x => x.def.type === 'longtext');
            const filledNonMoney = filledCustom.filter(x => x.def.type !== 'money' && x.def.type !== 'longtext');
            const displayCustom = [...filledMoney, ...filledNonMoney].slice(0, 3);
            // Determine card identity for template vs virtual
            const isTemplate = !r._isVirtual && r.type === "recurring";
            const clickId = r._isVirtual ? r._originalId : r.id;
            const clickCat = r._isVirtual ? r._originalCreatedAt : r.createdAt;
            // Attrs on template cards so scroll-to can find them
            const templateAttrs = isTemplate
              ? `data-rec-template-id="${r.id}" data-rec-template-cat="${r.createdAt}"`
              : '';
            const recIconSvg = _recurSvg('w-3 h-3');
            return `
            <div class="relative bg-gray-800 rounded p-3 mb-2 flex justify-between items-start border ${isTemplate ? 'border-purple-700/50' : r._isVirtual ? 'border-gray-700/40' : 'border-gray-700/60'} cursor-pointer" onclick="showShiftDetail('${clickId}',${clickCat})" style="${getLocationTintStyle(r.location)}" ${templateAttrs}>
              ${(isTemplate || r._isVirtual) ? `
                <div class="absolute top-1.5 right-1.5 z-10">
                  ${r._isVirtual
                    ? `<button type="button" onclick="event.stopPropagation();scrollToRecurringTemplate('${r._originalId}',${r._originalCreatedAt})"
                        class="w-5 h-5 rounded-full bg-purple-900/70 border border-purple-700/60 flex items-center justify-center text-purple-300 hover:bg-purple-700/80"
                        title="Go to original recurring entry">
                        ${recIconSvg}
                      </button>`
                    : `<div class="w-5 h-5 rounded-full bg-purple-900/50 border border-purple-700/50 flex items-center justify-center text-purple-400/80" title="Recurring template">
                        ${recIconSvg}
                      </div>`
                  }
                </div>
              ` : ''}
              <div class="flex-1 ${r._isVirtual || isTemplate ? 'pr-6' : ''}">
                <div class="text-xs text-gray-500 mb-1">
                  ${formatDate(r._virtualDate || r.date)}
                  ${isTemplate ? `<span class="ml-1 text-[10px] text-purple-400/70 font-mono">template</span>` : ''}
                </div>
                <div class="font-semibold text-lg">
                  ${money(totalForShift)}
                </div>
                <div class="text-xs text-gray-400">
                  ${r.hours}h • ${r.payType === 'flat' ? money(r.rate) : (money(r.rate) + '/hr')} • ${r.location}
                </div>
                ${r.tips > 0 ? `<div class="text-xs text-green-400">Tips: ${money(r.tips)}</div>` : ''}
              </div>
              <div class="ml-2 flex flex-col items-end gap-2">
                <div class="flex gap-2">
                  ${showDeletedRecords
                    ? `<button onclick="event.stopPropagation();restoreRecord('${r.id}',${r.createdAt})" class="text-xs bg-green-700 px-2 py-1 rounded">Restore</button>`
                    : r._isVirtual
                      /* Virtual: Source button only — no Edit, no Delete */
                      ? `<button onclick="event.stopPropagation();scrollToRecurringTemplate('${r._originalId}',${r._originalCreatedAt})"
                           class="text-xs bg-gray-700/80 px-2 py-1 rounded flex items-center gap-1.5 text-purple-300">
                           ${recIconSvg}<span>Source</span>
                         </button>`
                      : isTemplate
                        /* Template: ↻ Edit + Delete */
                        ? `<button onclick="event.stopPropagation();editRecord('${r.id}',${r.createdAt})"
                             class="text-xs bg-gray-700 px-2 py-1 rounded flex items-center gap-1.5 text-purple-300">
                             ${recIconSvg}<span>Edit</span>
                           </button>
                           <button onclick="event.stopPropagation();deleteRecord('${r.id}',${r.createdAt})" class="text-xs bg-red-900 px-2 py-1 rounded">✕</button>`
                        /* Normal record: plain Edit + Delete */
                        : `<button onclick="event.stopPropagation();editRecord('${r.id}',${r.createdAt})" class="text-xs bg-gray-700 px-2 py-1 rounded">Edit</button>
                           <button onclick="event.stopPropagation();deleteRecord('${r.id}',${r.createdAt})" class="text-xs bg-red-900 px-2 py-1 rounded">✕</button>`
                  }
                </div>
                ${!showDeletedRecords && (displayCustom.length || filledLongText.length) ? `
                  <div class="flex flex-col items-end gap-1">
                    ${displayCustom.map(({ def, raw }) => {
                      const label = def.label || 'Field';
                      if (def.type === 'money') {
                        const v = parseFloat(raw);
                        const mode = def.addToTotal || 'none';
                        const color = mode === 'add' ? 'text-green-300/80' : (mode === 'subtract' ? 'text-red-300/80' : 'text-gray-300/70');
                        const prefix = mode === 'add' ? '+' : (mode === 'subtract' ? '-' : '');
                        const abs = Number.isFinite(v) ? Math.abs(v) : 0;
                        return `<div class="text-[11px] ${color} text-right whitespace-nowrap">${label}: ${prefix}${money(abs)}</div>`;
                      }
                      if (def.type === 'checkbox') {
                        const checked = raw === true || raw === 'true' || raw === '1' || raw === 1;
                        if (!checked) return '';
                        return `<div class="text-[11px] text-gray-300/60 text-right whitespace-nowrap">${label}</div>`;
                      }
                      if (def.type === 'date') {
                        return `<div class="text-[11px] text-gray-300/60 text-right whitespace-nowrap">${label}: ${raw}</div>`;
                      }
                      if (def.type === 'number') {
                        const v = parseFloat(raw);
                        const out = Number.isFinite(v) ? v : raw;
                        return `<div class="text-[11px] text-gray-300/60 text-right whitespace-nowrap">${label}: ${out}</div>`;
                      }
                      // text/default
                      const str = String(raw);
                      const clipped = str.length > 18 ? (str.slice(0, 18) + '…') : str;
                      return `<div class="text-[11px] text-gray-300/60 text-right whitespace-nowrap">${label}: ${clipped}</div>`;
                    }).filter(Boolean).join('')}
                    ${filledLongText.map(({ def }) => `<div class="text-[11px] text-indigo-300/60 text-right italic whitespace-nowrap">has ${def.label}</div>`).join('')}
                  </div>
                ` : ''}
              </div>
            </div>
          `}).join("")}
        </div>
      `).join("")}
      
      ${!isFiltered && loadedMonths < months.length ? `
        <div id="loadMoreTrigger" class="text-center py-4">
          <div class="text-gray-500 text-sm">Scroll for more...</div>
        </div>
      ` : ''}
    </div>
  `;
  
  // Setup infinite scroll observer (only if not filtered)
  if (!isFiltered) {
    setupInfiniteScroll(months, monthTotals);
  }

  // Update banner with visible month
  updateBannerForVisibleMonth();

  // Immediately sync the sort indicator so it reflects the current sort state
  // without waiting for the IntersectionObserver (which only fires on scroll).
  const sortEl = $("sortIndicator");
  if (sortEl) {
    const isDefault = historySort.type === 'date' && historySort.direction === 'desc';
    if (isDefault) {
      sortEl.classList.add('hidden');
      sortEl.textContent = '';
    } else {
      const arrow = historySort.direction === 'asc' ? '↑' : '↓';
      let label;
      if (historySort.type === 'date')        label = `Date ${arrow}`;
      else if (historySort.type === 'total')  label = `Total ${arrow}`;
      else label = `${historySort.key ? historySort.key.replace(/CustomField_/,'').replace(/_/g,' ') : 'Custom'} ${arrow}`;
      sortEl.textContent = `⇅ ${label}`;
      sortEl.classList.remove('hidden');
    }
  }
}

function showShiftDetail(id, createdAt) {
  const data = loadData();
  const defs = getCustomFieldDefs();
  const r = createdAt
    ? data.records?.find(rec => rec.id === id && rec.createdAt === createdAt)
    : data.records?.find(rec => rec.id === id);
  if (!r) return;

  const formatDate = (isoDate) => {
    const [y, m, d] = isoDate.split("-");
    return new Date(y, m - 1, d).toDateString();
  };

  const basePay = calculateBasePay(r);
  const tips = parseFloat(r.tips) || 0;
  const total = calculateRecordTotal(r, defs);

  const moneyDefs = defs.filter(d => d.type === 'money' && r[d.key] != null && r[d.key] !== '');
  const otherDefs = defs.filter(d => d.type !== 'money' && d.type !== 'longtext' && r[d.key] != null && r[d.key] !== '' && !(d.type === 'checkbox' && r[d.key] !== 'true' && r[d.key] !== true && r[d.key] !== 1 && r[d.key] !== '1'));
  const longDefs = defs.filter(d => d.type === 'longtext' && r[d.key] != null && r[d.key] !== '');

  } else {

  if (tips > 0) {
    breakdownRows += `<div class="flex justify-between text-sm py-1"><span class="text-gray-400">Tips</span><span class="text-green-400">+${money(tips)}</span></div>`;
  }
  moneyDefs.forEach(def => {
    const v = parseFloat(r[def.key]);
    if (!Number.isFinite(v)) return;
    const mode = def.addToTotal || 'none';
    const abs = Math.abs(v);
    const color = mode === 'add' ? 'text-green-400' : mode === 'subtract' ? 'text-red-400' : 'text-gray-300';

  const otherRows = otherDefs.map(def => {

    if (def.type === 'checkbox') val = '✓';
    if (def.type === 'date') { try { const [y,m,d] = val.split('-'); val = new Date(y,m-1,d).toDateString(); } catch {} }

  }).join('');

  const longRows = longDefs.map(def => `
    <div>
      <div class="text-xs text-gray-400 mb-1 font-medium">${def.label}</div>
      <div class="text-sm text-gray-200 whitespace-pre-wrap bg-gray-950/50 rounded-lg p-3 leading-relaxed">${String(r[def.key]).replace(/&/g,'&amp;').replace(/</g,'&lt;')}</div>
    </div>
  `).join('');

  const locColor = normalizeHexColor(data.locations?.[r.location]?.preferredColor);
  const dotStyle = locColor ? `style="background:${locColor}"` : 'style="background:#4b5563"';

  const sheet = `
    <div id="shiftDetailOverlay" class="fixed inset-0 bg-black/60 z-40" onclick="closeShiftDetail()"></div>
    <div id="shiftDetailSheet" class="fixed bottom-20 inset-x-0 max-h-[82vh] overflow-y-auto bg-gray-900 rounded-t-2xl z-50 transform transition-transform duration-300 translate-y-full">
      <div class="sticky top-0 bg-gray-900/95 backdrop-blur rounded-t-2xl px-4 pt-4 pb-3 flex items-center justify-between border-b border-gray-700/50">
        <div class="flex items-center gap-2.5">
          <span class="w-3 h-3 rounded-full flex-shrink-0" ${dotStyle}></span>
          <div>
            <div class="text-[11px] text-gray-400">${formatDate(r.date)}</div>
            <div class="text-sm font-semibold text-gray-100">${r.location}</div>
          </div>
        </div>
        <button onclick="closeShiftDetail()" class="text-gray-400 text-xs px-3 py-1.5 bg-gray-800 rounded-lg">Close</button>
      </div>
      <div class="p-4 space-y-3 pb-6">
        <div class="bg-gray-800/50 rounded-xl p-4 border border-gray-700/40">

          ${breakdownRows}
          <div class="border-t border-gray-700/60 mt-2 pt-2 flex justify-between font-semibold">
            <span class="text-gray-100">Total</span>

function closeShiftDetail() {
  const sheet = $("shiftDetailSheet");
  const overlay = $("shiftDetailOverlay");
  if (sheet) sheet.classList.add("translate-y-full");

  }, 300);
}

/**
 * Scroll history to the recurring template card.
 * Navigates history to the template's specific month, scrolls to the card,
 * and applies a 3-second purple glow highlight.
 */
function scrollToRecurringTemplate(id, createdAt) {
  // Ensure glow keyframe is injected once
  if (!document.getElementById('_recurGlowStyle')) {
    const s = document.createElement('style');
    s.id = '_recurGlowStyle';
    s.textContent = `
      @keyframes _recurGlow {
        0%   { box-shadow: 0 0 0 2px #a855f7, 0 0 16px 4px rgba(168,85,247,0.35); }
        70%  { box-shadow: 0 0 0 2px #a855f7, 0 0 16px 4px rgba(168,85,247,0.35); }
        100% { box-shadow: none; }
      }
      ._rec-glow { animation: _recurGlow 3s ease-out forwards; border-radius: 0.5rem; }
    `;
    document.head.appendChild(s);
  }

  const applyGlow = card => {
    card.classList.remove('_rec-glow');
    void card.offsetWidth; // reflow to restart animation
    card.classList.add('_rec-glow');
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    setTimeout(() => card.classList.remove('_rec-glow'), 3100);
  };

  // If card is already in the DOM, glow immediately
  const existing = document.querySelector(`[data-rec-template-id="${id}"]`);
  if (existing) { applyGlow(existing); return; }

  // Look up the template's actual date from storage so we can filter to its month
  const data = loadData();
  const template = data.records.find(r => r.id === id);
  if (!template) return;

  const templateDate = template.date; // "YYYY-MM-DD"
  const [y, m] = templateDate.split('-');
  const monthStart = `${y}-${m}-01`;
  // last day of month
  const lastDay = new Date(+y, +m, 0).getDate();
  const monthEnd = `${y}-${m}-${String(lastDay).padStart(2, '0')}`;
  const monthLabel = new Date(+y, +m - 1, 1).toLocaleString('default', { month: 'long', year: 'numeric' });

  // Switch to that month range and re-render
  setDateFilter('range', monthStart, monthEnd, monthLabel);

  // After render, scroll and glow
  setTimeout(() => {
    const card = document.querySelector(`[data-rec-template-id="${id}"]`);
    if (card) applyGlow(card);
  }, 350);
}

function setupInfiniteScroll(months, monthTotals) {
  // Remove any existing scroll listeners first
  window.removeEventListener('scroll', handleHistoryScroll);
  
  // Use simple scroll event instead of IntersectionObserver
  window.addEventListener('scroll', handleHistoryScroll);
}

function handleHistoryScroll() {
  // Only run if we're on history tab
  if (activeTab !== 'history') return;
  
  const scrollTop = window.scrollY || document.documentElement.scrollTop;
  const scrollHeight = document.documentElement.scrollHeight;
  const clientHeight = document.documentElement.clientHeight;
  
  console.log('Scroll check:', { scrollTop, clientHeight, scrollHeight, loadedMonths });
  
  // When user scrolls within 150px of bottom
  if (scrollTop + clientHeight >= scrollHeight - 150) {
    // Get months from data
    const allData = loadData();
    let records = showDeletedRecords 
      ? allData.records.filter(r => r.deleted)
      : allData.records.filter(r => !r.deleted);
    records.sort((a, b) => b.date.localeCompare(a.date));
    
    const byMonth = {};
    records.forEach(r => {
      const monthKey = r.date.substring(0, 7);
      if (!byMonth[monthKey]) byMonth[monthKey] = [];
      byMonth[monthKey].push(r);
    });
    const months = Object.keys(byMonth).sort((a, b) => b.localeCompare(a));
    
    console.log('Loaded months:', loadedMonths, 'Total months:', months.length);
    
    if (loadedMonths < months.length) {
      isScrollLoad = true;
      loadedMonths++;
      console.log('Loading more months:', loadedMonths);
      renderHistory();
    }
  }
}

function updateBannerForVisibleMonth() {
  const months = document.querySelectorAll('.month-group');
  if (months.length === 0) return;
  
  const observer = new IntersectionObserver((entries) => {
    let maxVisibleMonth = null;
    let maxVisibleRatio = 0;
    
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const ratio = entry.intersectionRatio;
        if (ratio > maxVisibleRatio) {
          maxVisibleRatio = ratio;
          maxVisibleMonth = entry.target;
        }
      }
    });
    
    if (maxVisibleMonth) {
      const total = maxVisibleMonth.dataset.total;
      const month = maxVisibleMonth.dataset.month;
      const [year, mon] = month.split('-');
      const date = new Date(year, mon - 1, 1);
      const monthName = date.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
      
      $("monthlyBannerValue").textContent = money(parseFloat(total));
      $("dateFilterLabel").textContent = monthName;
    }
  }, { threshold: 0.1 });
  
  months.forEach(m => observer.observe(m));
}

function updateMonthlyTotal(records) {
  const defs = getCustomFieldDefs();
  const total = records.reduce((s,r)=>s + calculateRecordTotal(r, defs), 0);
  $("monthlyBannerValue").textContent = money(total);
  
  // Update the label and indicator
  const labelEl = $("dateFilterLabel");
  const indicatorEl = $("filterIndicator");
  if (labelEl) {
    labelEl.textContent = dateFilter.label;
  }
  if (indicatorEl) {
    if (dateFilter.type === 'all') {
      indicatorEl.textContent = '∞';
    } else if (dateFilter.type === 'ytd') {
      indicatorEl.textContent = '📅';
    } else if (dateFilter.type === 'month') {
      indicatorEl.textContent = '📆';
    } else if (dateFilter.type === 'past3months') {
      indicatorEl.textContent = '3';
    } else if (dateFilter.type === 'range') {
      indicatorEl.textContent = '📋';
    }
  }

  // Sort indicator — show amber pill when sort is not the default (date desc)
  const sortEl = $("sortIndicator");
  if (sortEl) {
    const isDefault = historySort.type === 'date' && historySort.direction === 'desc';
    if (isDefault) {
      sortEl.classList.add('hidden');
    } else {
      const arrow = historySort.direction === 'asc' ? '↑' : '↓';
      let label;
      if (historySort.type === 'date')  label = `Date ${arrow}`;
      else if (historySort.type === 'total') label = `Total ${arrow}`;
      else label = `${historySort.key ? historySort.key.replace(/CustomField_/,'').replace(/_/g,' ') : 'Custom'} ${arrow}`;
      sortEl.textContent = `⇅ ${label}`;
      sortEl.classList.remove('hidden');
    }
  }
}

function saveLocationEdit(oldName) {
  const newName = $("locEditName")?.value?.trim();
  const chosen = document.querySelector('input[name="locColor"]:checked')?.value || "";
  const preferredColor = normalizeHexColor(chosen);

  if (!newName) {
    showToast("Location name is required", 2000);
    return;
  }

  const data = loadData();
  if (!data.locations || !data.locations[oldName]) {
    showToast("Location not found", 2000);
    closeLocationEditMenu();
    return;
  }

  const oldMeta = data.locations[oldName] || {};
  const nextMeta = { ...oldMeta, preferredColor: preferredColor };

  if (newName !== oldName) {
    if (data.locations[newName]) {
      showToast("That name already exists", 2200);
      return;
    }
    data.locations[newName] = nextMeta;
    delete data.locations[oldName];
    data.records.forEach(r => {
      if (r.location === oldName) {
        r.location = newName;
        r.updatedAt = Date.now();
      }
    });
  } else {
    data.locations[oldName] = nextMeta;
  }

  saveData(data);
  closeLocationEditMenu();
  showToast("Location updated", 1500);
  renderSettings();
  try { renderHistory(); } catch {}
  try { renderAllCharts(); } catch {}
}

function renameLocation(oldName) {
  const newName = prompt("Enter new name for '" + oldName + "':");
  if (newName && newName !== oldName) {
    const data = loadData();
    // Update location rate
    const rate = data.locations[oldName].lastRate;
    const preferredColor = normalizeHexColor(data.locations[oldName].preferredColor);
    data.locations[newName] = { lastRate: rate, preferredColor: preferredColor };
    delete data.locations[oldName];
    
    // Update all records with this location
    data.records.forEach(r => {
      if (r.location === oldName) {
        r.location = newName;
        r.updatedAt = Date.now();
      }
    });
    
    saveData(data);
    showToast("Location renamed!", 2000);
    renderSettings();
  }
}

function showMergeLocations() {
  const data = loadData();
  const locations = Object.keys(data.locations || {});
  
  if (locations.length < 2) {
    showToast("Need at least 2 locations to merge", 2000);
    return;
  }
  
  const from = prompt("Enter source location to merge FROM:");
  const to = prompt("Enter destination location to merge TO:");
  
  if (from && to && from !== to && data.locations[from] && data.locations[to]) {
    // Merge: update all records from 'from' to 'to'
    let count = 0;
    data.records.forEach(r => {
      if (r.location === from) {
        r.location = to;
        r.updatedAt = Date.now();
        count++;
      }
    });
    
    // Delete the source location
    delete data.locations[from];
    
    saveData(data);
    showToast(`Merged ${count} records to "${to}"`, 3000);
    renderSettings();
  } else {
    showToast("Invalid location names", 2000);
  }
}

function exportData() {
  const data = loadData();
  
  // Ask user which format
  const format = prompt('Export as JSON or CSV? (type: json or csv)', 'json');
  
  if (format && format.toLowerCase() === 'csv') {
    exportAsCSV(data);
  } else {
    // Original JSON export
    const text = JSON.stringify(data, null, 2);
    if (navigator.share) {
      navigator.share({ text: text }).then(() => {
        showToast("Shared!", 2000);
      }).catch(err => {
        console.log("Share cancelled or failed", err);
        copyToClipboard(text);
      });
    } else {
      copyToClipboard(text);
    }
  }
}

function exportAsCSV(data) {
  const records = data.records.filter(r => !r.deleted);
  const defs = data.customFields || [];
  
  // CSV header
  let csv = 'Date,Hours,Rate,PayType,Location,Tips,Total\n';
  
  // Add rows
  records.forEach(r => {
    const total = calculateRecordTotal(r, defs);
    csv += `${r.date},${r.hours},${r.rate},${r.payType || 'hourly'},"${r.location}",${r.tips},${total.toFixed(2)}\n`;
  });
  
  // Add summary at end
  const totalHours = records.reduce((s, r) => s + r.hours, 0);
  const totalTips = records.reduce((s, r) => s + r.tips, 0);
  const totalIncome = records.reduce((s, r) => s + calculateRecordTotal(r, defs), 0);
  
  csv += `\nSummary\n`;
  csv += `Total Hours,${totalHours.toFixed(2)}\n`;
  csv += `Total Tips,${totalTips.toFixed(2)}\n`;
  csv += `Total Income,${totalIncome.toFixed(2)}\n`;
  
  if (navigator.share) {
    navigator.share({ text: csv }).then(() => {
      showToast("Shared CSV!", 2000);
    }).catch(err => {
      copyToClipboard(csv);
    });
  } else {
    copyToClipboard(csv);
  }
}

function copyToClipboard(text) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      showToast("Copied to clipboard!", 2000);
    }).catch(() => {
      prompt("Copy this JSON:", text);
    });
  } else {
    prompt("Copy this JSON:", text);
  }
}

function importData() {
  try {
    const raw = $("importArea").value;
    const parsed = JSON.parse(raw);

    if (!parsed.records || !Array.isArray(parsed.records)) {
      alert("Invalid format.");
      return;
    }

    saveData(parsed);

    // After import, advance income_meta.nextId past the highest existing ID
    // so newly-created records never collide with imported ones.
    const meta = loadMeta();
    const maxSuffix = parsed.records.reduce((max, r) => {
      const m = r.id && r.id.match(/_(\d+)$/);
      return m ? Math.max(max, parseInt(m[1], 10)) : max;
    }, 0);
    if (maxSuffix >= meta.nextId) {
      meta.nextId = maxSuffix + 1;
      saveMeta(meta);
    }

    alert("Import successful.");
    switchTab("history");
  } catch (e) {
    alert("Invalid JSON.");
  }
}

   ================================ */

function detectDataIssues(data) {
  // Find duplicate IDs
  const idCount = {};
  for (const r of data.records) {
    if (!r.id) continue;
    idCount[r.id] = (idCount[r.id] || 0) + 1;
  }
  const dups = {};
  for (const r of data.records) {
    if (r.id && idCount[r.id] > 1) {
      if (!dups[r.id]) dups[r.id] = [];
      dups[r.id].push(r);
    }
  }
  // Find other issues
  const other = [];
  for (const r of data.records) {
    const problems = [];
    if (!r.payType) problems.push('Missing pay type');
    if (r.createdAt == null) problems.push('Missing creation timestamp');
    if (r.hours != null && isNaN(parseFloat(r.hours))) problems.push('Invalid hours value');
    if (r.rate != null && isNaN(parseFloat(r.rate))) problems.push('Invalid rate value');
    if (r.tips != null && isNaN(parseFloat(r.tips))) problems.push('Invalid tips value');
    if (problems.length) other.push({ record: r, problems });
  }
  return { duplicateIds: dups, otherIssues: other };
}

      <div id="cleanDataContent" class="p-4 space-y-4 pb-10"></div>
    </div>
  `);
  requestAnimationFrame(() => {
    const s = document.getElementById('cleanDataSheet');
    if (s) s.classList.remove('translate-y-full');
    const data = loadData();
    const issues = detectDataIssues(data);
    if (Object.keys(issues.duplicateIds).length > 0) {
      _renderCleanScreen1(issues);
    } else if (issues.otherIssues.length > 0) {
      _renderCleanScreen2(issues, 0);
    } else {
      _renderCleanDone(0, 0);
    }
  });
}

function _renderCleanScreen1(issues) {
  const groups = Object.entries(issues.duplicateIds);
  let rows = '';
  for (const [id, recs] of groups) {
    const recItems = recs.map(r => {
      const amt = r.amount != null ? `$${parseFloat(r.amount).toFixed(2)}` : '—';
      const status = r.deleted
        ? '<span class="text-red-400">deleted</span>'
        : '<span class="text-emerald-400">active</span>';
      return `<div class="flex items-center justify-between text-xs text-gray-300 bg-gray-900/50 rounded-lg px-3 py-2">
        <span>${r.date || '—'} · ${r.location || '—'} · ${amt}</span>
        ${status}
      </div>`;
    }).join('');
    rows += `<div class="bg-gray-800/60 border border-gray-700/40 rounded-xl p-3 space-y-2">
      <div class="text-xs font-mono text-amber-400 truncate">${id}</div>
      ${recItems}
    </div>`;
  }
  document.getElementById('cleanDataContent').innerHTML = `
    <div class="flex items-center justify-between">
      <div class="text-lg font-bold">Duplicate Record IDs</div>
      <button onclick="closeCleanDataMenu()" class="text-xs text-gray-400 py-1 px-2">Close</button>
    </div>
    <div class="text-sm text-gray-400">${groups.length} ID${groups.length !== 1 ? 's' : ''} shared by multiple records. This can cause edits and deletes to target the wrong record.</div>
    <div class="space-y-3">${rows}</div>
    <button onclick="_cleanAutoFixDups()" class="w-full bg-indigo-600 hover:bg-indigo-500 p-3 rounded-xl font-semibold">Fix All Automatically</button>
    <button onclick="_cleanSkipDups()" class="w-full bg-gray-800 hover:bg-gray-700 p-3 rounded-xl text-gray-300">Skip</button>
  `;
}

function _cleanAutoFixDups() {
  const data = loadData();
  // Track which IDs we've seen — reassign all but first occurrence
  const seen = {};
  let fixed = 0;
  for (const r of data.records) {
    if (!r.id) continue;
    if (seen[r.id]) {
      r.id = generateId();
      fixed++;
    } else {
      seen[r.id] = true;
    }
  }
  saveData(data);
  const issues = detectDataIssues(data);
  if (issues.otherIssues.length > 0) {
    _renderCleanScreen2(issues, fixed);
  } else {
    _renderCleanDone(fixed, 0);
  }
}

function _cleanSkipDups() {
  const data = loadData();
  const issues = detectDataIssues(data);
  if (issues.otherIssues.length > 0) {
    _renderCleanScreen2(issues, 0);
  } else {
    _renderCleanDone(0, 0);
  }
}

function _renderCleanScreen2(issues, fixedDups) {
  const items = issues.otherIssues;
  let cards = '';
  for (const { record: r, problems } of items) {
    const amt = r.amount != null ? `$${parseFloat(r.amount).toFixed(2)}` : '—';
    const idEsc = (r.id || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    const cAt = r.createdAt || 0;
    const problemList = problems.map(p => `<div class="text-amber-400">• ${p}</div>`).join('');
    cards += `
      <div class="bg-gray-800/60 border border-gray-700/40 rounded-xl p-3 space-y-2">
        <div class="flex items-center justify-between text-xs text-gray-300">
          <span>${r.date || '—'} · ${r.location || '—'} · ${amt}</span>
          ${r.deleted ? '<span class="text-red-400 text-[10px]">deleted</span>' : ''}
        </div>
        <div class="text-[11px] space-y-0.5">${problemList}</div>
        <div class="flex gap-2 pt-1">
          <button onclick="_cleanFixRecord('${idEsc}',${cAt},${fixedDups})" class="flex-1 bg-indigo-600/80 hover:bg-indigo-600 py-1.5 rounded-lg text-xs font-semibold">Fix</button>
          <button onclick="_cleanDeleteRecord('${idEsc}',${cAt},${fixedDups})" class="flex-1 bg-red-700/60 hover:bg-red-700 py-1.5 rounded-lg text-xs text-red-200">Delete</button>
        </div>
      </div>`;
  }
  document.getElementById('cleanDataContent').innerHTML = `
    <div class="flex items-center justify-between">
      <div class="text-lg font-bold">Other Data Issues</div>
      <button onclick="closeCleanDataMenu()" class="text-xs text-gray-400 py-1 px-2">Close</button>
    </div>
    <div class="text-sm text-gray-400">${items.length} record${items.length !== 1 ? 's' : ''} with data issues found.</div>
    <button onclick="_cleanFixAllOther(${fixedDups})" class="w-full bg-indigo-600 hover:bg-indigo-500 p-3 rounded-xl font-semibold">Fix All Automatically</button>
    <div class="space-y-3">${cards}</div>
    <button onclick="_renderCleanDone(${fixedDups}, 0)" class="w-full bg-gray-800 hover:bg-gray-700 p-3 rounded-xl text-gray-400 text-sm">Done</button>
  `;
}

function _cleanFixRecord(id, createdAt, fixedDups) {
  const data = loadData();
  const r = createdAt
    ? data.records.find(rec => rec.id === id && rec.createdAt === createdAt)
    : data.records.find(rec => rec.id === id);
  if (!r) return;
  if (!r.payType) r.payType = 'hourly';
  if (r.createdAt == null) r.createdAt = Date.now();
  if (r.hours != null && isNaN(parseFloat(r.hours))) r.hours = 0;
  if (r.rate != null && isNaN(parseFloat(r.rate))) r.rate = 0;
  if (r.tips != null && isNaN(parseFloat(r.tips))) r.tips = 0;
  saveData(data);
  const issues = detectDataIssues(data);
  if (issues.otherIssues.length > 0) {
    _renderCleanScreen2(issues, fixedDups);
  } else {
    _renderCleanDone(fixedDups, 0);
  }
}

function _cleanDeleteRecord(id, createdAt, fixedDups) {
  const data = loadData();
  const idx = createdAt
    ? data.records.findIndex(rec => rec.id === id && rec.createdAt === createdAt)
    : data.records.findIndex(rec => rec.id === id);
  if (idx === -1) return;
  data.records.splice(idx, 1);
  saveData(data);
  const issues = detectDataIssues(data);
  if (issues.otherIssues.length > 0) {
    _renderCleanScreen2(issues, fixedDups);
  } else {
    _renderCleanDone(fixedDups, 0);
  }
}

function _cleanFixAllOther(fixedDups) {
  const data = loadData();
  let fixed = 0;
  for (const r of data.records) {
    let changed = false;
    if (!r.payType) { r.payType = 'hourly'; changed = true; }
    if (r.createdAt == null) { r.createdAt = Date.now(); changed = true; }
    if (r.hours != null && isNaN(parseFloat(r.hours))) { r.hours = 0; changed = true; }
    if (r.rate != null && isNaN(parseFloat(r.rate))) { r.rate = 0; changed = true; }
    if (r.tips != null && isNaN(parseFloat(r.tips))) { r.tips = 0; changed = true; }
    if (changed) fixed++;
  }
  saveData(data);
  _renderCleanDone(fixedDups, fixed);
}

function _renderCleanDone(fixedDups, fixedOther) {
  const total = fixedDups + fixedOther;
  const details = [
    fixedDups > 0 ? `${fixedDups} duplicate ID${fixedDups !== 1 ? 's' : ''}` : '',
    fixedOther > 0 ? `${fixedOther} field issue${fixedOther !== 1 ? 's' : ''}` : ''
  ].filter(Boolean).join(', ');
  document.getElementById('cleanDataContent').innerHTML = `
    <div class="flex items-center justify-between">
      <div class="text-lg font-bold">Data Health</div>
      <button onclick="closeCleanDataMenu()" class="text-xs text-gray-400 py-1 px-2">Close</button>
    </div>
    <div class="flex flex-col items-center py-8 gap-4">
      <div class="w-16 h-16 rounded-full bg-emerald-600/20 border border-emerald-500/40 flex items-center justify-center">
        <svg class="w-8 h-8 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
      </div>
      <div class="text-base font-bold text-emerald-300">${total > 0 ? 'Data Cleaned' : 'Data is Healthy'}</div>
      <div class="text-sm text-gray-400 text-center">
        ${total > 0 ? `Fixed ${total} issue${total !== 1 ? 's' : ''}: ${details}.` : 'No data integrity issues found.'}
      </div>
    </div>
    <button onclick="closeCleanDataMenu()" class="w-full bg-gray-800 hover:bg-gray-700 p-3 rounded-xl font-semibold">Done</button>
  `;
}

function closeCleanDataMenu() {
  const sheet = document.getElementById('cleanDataSheet');
  const overlay = document.getElementById('cleanDataOverlay');
  if (sheet) {
    sheet.classList.add('translate-y-full');
    setTimeout(() => {
      sheet.remove();
      if (overlay) overlay.remove();
    }, 300);
  } else if (overlay) {
    overlay.remove();
  }
}

/* ================================
   APP UPDATE / VERSION CHECKER
================================= */

let _swReg          = null;   // holds the SW registration once available
let _updateState    = 'idle'; // 'idle' | 'checking' | 'current' | 'available' | 'error'
let _latestVersion  = null;   // version string fetched from server

/**
 * Register the service worker and wire up update detection.
 * Called once on startup.
 */
async function initServiceWorker() {
  if (!('serviceWorker' in navigator)) return;
  try {
    _swReg = await navigator.serviceWorker.register('sw.js');

    // A new SW is already waiting (installed before this page load)
    if (_swReg.waiting) {
      _updateState = 'available';
      renderSettingsIfActive();
    }

    // A new SW starts installing while the page is open
    _swReg.addEventListener('updatefound', () => {
      const installing = _swReg.installing;
      installing.addEventListener('statechange', () => {
        if (installing.state === 'installed' && navigator.serviceWorker.controller) {
          _updateState = 'available';
          renderSettingsIfActive();
          showUpdateBanner();
        }
      });
    });

    // After skipWaiting the controller changes — reload to run new code.
    // Guard with hadController so first-time SW activation (clients.claim on a
    // page that had no previous controller) does NOT trigger a spurious reload.
    const hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (hadController) window.location.reload();
    });
  } catch (e) {
    console.warn('SW registration failed:', e);
  }
}

/** Re-renders settings only if the user is currently on that tab. */
function renderSettingsIfActive() {
  if (activeTab === 'settings') renderSettings();
}

/**
 * Fetch version.json from the server (bypassing all caches) and compare
 * with APP_VERSION.  Updates _updateState and _latestVersion.
 */
async function checkForAppUpdate() {
  if (!navigator.onLine) {
    showToast('No internet connection', 2500);
    return;
  }
  _updateState = 'checking';
  renderSettingsIfActive();

  try {
    // Trigger the SW's own update check in parallel
    if (_swReg) _swReg.update().catch(() => {});

    // Fetch the canary version file — sw.js never caches this
    const res = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const { version } = await res.json();
    _latestVersion = version;

    if (_swReg?.waiting || version !== APP_VERSION) {
      _updateState = 'available';
    } else {
      _updateState = 'current';
    }
  } catch (e) {
    _updateState = 'error';
  }
  renderSettingsIfActive();
}

/**
 * Tell the waiting SW to skip its waiting state, which will trigger
 * controllerchange → window.location.reload().
 * If there's no waiting SW but the server has a newer version, do a
 * hard reload so the (already-active) new SW serves fresh files.
 */
function applyAppUpdate() {
  if (_swReg?.waiting) {
    // Standard path: new SW is waiting → tell it to activate
    _swReg.waiting.postMessage({ type: 'SKIP_WAITING' });
    // controllerchange listener above will call reload()
  } else {
    // SW already activated (skipWaiting happened before this page loaded)
    // or no SW at all — just reload to get fresh files from the server/SW
    window.location.reload();
  }
}

/** Non-intrusive sticky banner shown when an update becomes available mid-session. */
function showUpdateBanner() {
  if (document.getElementById('updateBanner')) return;
  document.body.insertAdjacentHTML('beforeend', `
    <div id="updateBanner"
         class="fixed top-0 inset-x-0 z-[100] bg-indigo-600 text-white text-xs font-semibold
                flex items-center justify-between px-4 py-2 safe-top"
         style="padding-top: max(0.5rem, env(safe-area-inset-top))">
      <span>New version available</span>
      <div class="flex items-center gap-3">
        <button onclick="applyAppUpdate()" class="underline underline-offset-2">Reload now</button>
        <button onclick="document.getElementById('updateBanner').remove()" class="opacity-60">✕</button>
      </div>
    </div>
  `);
}

/* ================================
   ZOOM LOCK (iOS Safari)
================================= */
// Strategy: no user-scalable=no (that triggers Safari nav bar in PWA mode).
// Instead:
//   1. Block pinch-zoom via gesture events (iOS proprietary, safe to cancel).
//   2. Temporarily add maximum-scale=1 only while an input/textarea/select is
//      focused — this stops iOS auto-zooming on focus (triggered when
//      font-size < 16px) without permanently restricting the viewport.
//   3. touch-action: manipulation on <body> already kills double-tap zoom.

(function () {
  const _vp  = document.querySelector('meta[name="viewport"]');
  const _base = _vp.getAttribute('content');
  const _locked = _base + ', maximum-scale=1';

  // Block pinch-zoom gestures entirely
  document.addEventListener('gesturestart',  e => e.preventDefault(), { passive: false });
  document.addEventListener('gesturechange', e => e.preventDefault(), { passive: false });
  document.addEventListener('gestureend',    e => e.preventDefault(), { passive: false });

  // Lock viewport scale only while an input is focused (prevents focus-zoom)
  document.addEventListener('focusin', e => {
    if (['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) {
      _vp.setAttribute('content', _locked);
    }
  });
  document.addEventListener('focusout', e => {
    if (['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) {
      _vp.setAttribute('content', _base);
    }
  });
})();

/* ================================
   SUITE LAUNCHER & DRUM
================================= */

const SUITE_MODULES = [
  { id: 'labor',  label: 'Labor',  color: '#6366F1', desc: 'Income Tracking' },
  { id: 'loss',   label: 'Loss',   color: '#F43F5E', desc: 'Spending Tracker' },
  { id: 'limit',  label: 'Limit',  color: '#F59E0B', desc: 'Budget Intelligence' },
  { id: 'loan',   label: 'Loan',   color: '#F97316', desc: 'Loan Optimizer' },
  { id: 'legacy', label: 'Legacy', color: '#10B981', desc: 'Investment Tracker' },
  { id: 'liquid', label: 'Liquid', color: '#06B6D4', desc: 'Net Worth Engine' },
];

let _drumIdx = 0;          // logical face index (0-5)
let _drumStep = 0;         // CSS position counter (resets after wrap)
let _drumInterval = null;  // auto-rotate interval (hover/open only)
let _drumResetTimer = null;// pending wrap-reset timer
let _drumHovering = false; // is the button being hovered
let _launcherOpen = false; // is the suite panel open
let _activeModule = 'labor';
const DRUM_FACE_H = 44;

function _drumAdvance() {
  if (_drumResetTimer) { clearTimeout(_drumResetTimer); _drumResetTimer = null; }
  const drum = document.getElementById('suiteDrum');
  if (!drum) return;
  _drumStep++;
  _drumIdx = _drumStep % 6;
  drum.style.transform = `translateY(-${_drumStep * DRUM_FACE_H}px)`;
  if (_drumStep >= 6) {
    _drumResetTimer = setTimeout(() => {
      _drumResetTimer = null;
      const d = document.getElementById('suiteDrum');
      if (!d) return;
      d.style.transition = 'none';
      _drumStep = _drumStep % 6;
      _drumIdx = _drumStep;
      d.style.transform = `translateY(-${_drumStep * DRUM_FACE_H}px)`;
      requestAnimationFrame(() => { if (d) d.style.transition = ''; });
    }, 560);
  }
}

function _startDrum() {
  if (_drumInterval) return;
  _drumInterval = setInterval(_drumAdvance, 3200);
}

function _stopDrum() {
  if (_drumInterval) { clearInterval(_drumInterval); _drumInterval = null; }
}

function _quickSpin() {
  let count = 0;
  const spin = setInterval(() => {
    _drumAdvance();
    if (++count >= 6) clearInterval(spin);
  }, 75);
}

// Smoothly settle the drum back to the active module's face
function _settleDrum() {
  if (_drumResetTimer) { clearTimeout(_drumResetTimer); _drumResetTimer = null; }
  const faceIdx = SUITE_MODULES.findIndex(m => m.id === _activeModule);
  if (faceIdx < 0) return;
  const drum = document.getElementById('suiteDrum');
  if (!drum) return;
  // Find shortest forward path to target from current position
  const cur = _drumStep % 6;
  const stepsForward = faceIdx >= cur ? (faceIdx - cur) : (6 - cur + faceIdx);
  if (stepsForward === 0) return; // already there
  drum.style.transition = 'transform 0.42s cubic-bezier(0.4,0,0.2,1)';
  _drumStep += stepsForward;
  _drumIdx = faceIdx;
  drum.style.transform = `translateY(-${_drumStep * DRUM_FACE_H}px)`;
  // Clean up the step counter after the transition
  setTimeout(() => {
    const d = document.getElementById('suiteDrum');
    if (!d) return;
    d.style.transition = 'none';
    _drumStep = faceIdx;
    d.style.transform = `translateY(-${faceIdx * DRUM_FACE_H}px)`;
    requestAnimationFrame(() => { if (d) d.style.transition = ''; });
  }, 450);
}

// Assign each face its own module color (face 6 = duplicate of face 0)
function _applyFaceColors() {
  document.querySelectorAll('.suite-face').forEach((el, i) => {
    el.style.color = SUITE_MODULES[i % 6].color;
  });
}

function toggleSuiteLauncher() {
  if (_launcherOpen) { closeSuiteLauncher(); return; }
  const panel = document.getElementById('suiteLauncher');
  const chevron = document.getElementById('suiteChevron');
  if (!panel) return;
  panel.classList.remove('hidden');
  _launcherOpen = true;
  if (chevron) chevron.style.transform = 'rotate(180deg)';
  _startDrum();
  setTimeout(() => {
    document.addEventListener('click', _suiteLauncherOutsideClick, { once: true });
  }, 0);
}

function closeSuiteLauncher() {
  const panel = document.getElementById('suiteLauncher');
  const chevron = document.getElementById('suiteChevron');
  if (panel) panel.classList.add('hidden');
  if (chevron) chevron.style.transform = '';
  _launcherOpen = false;
  document.removeEventListener('click', _suiteLauncherOutsideClick);
  // Stop rotation and settle back to active module
  _stopDrum();
  _settleDrum();
}

function _suiteLauncherOutsideClick(e) {
  const panel = document.getElementById('suiteLauncher');
  const btn = document.getElementById('suiteLaunchBtn');
  if (panel && !panel.contains(e.target) && btn && !btn.contains(e.target)) {
    closeSuiteLauncher();
  }
}

function switchSuiteModule(id) {
  closeSuiteLauncher();
  _activeModule = id;

  // Update suite button active states
  SUITE_MODULES.forEach(m => {
    const btn = document.getElementById(`suiteBtn-${m.id}`);
    if (btn) btn.classList.toggle('active', m.id === id);
  });

  // Colors are permanently per-face; nothing to update here

  // Snap drum to this module's face immediately (no hover running)
  const faceIdx = SUITE_MODULES.findIndex(m => m.id === id);
  if (faceIdx >= 0) {
    const drum = document.getElementById('suiteDrum');
    if (drum) {
      drum.style.transition = 'transform 0.4s cubic-bezier(0.4,0,0.2,1)';
      _drumStep = faceIdx;
      _drumIdx = faceIdx;
      drum.style.transform = `translateY(-${faceIdx * DRUM_FACE_H}px)`;
      setTimeout(() => { if (drum) { drum.style.transition = 'none'; requestAnimationFrame(() => { if(drum) drum.style.transition=''; }); } }, 420);
    }
  }

  // Live app navigation — add new app paths here as they launch
  const APP_URLS = {
    loss:   '/Loss/',
    loan:   '/Loan/',
    limit:  '/Limit/?from=labor',
    legacy: '/Legacy/?from=labor',
    liquid: '/Liquid/?from=labor',

  if (id === 'labor') {
    _showLaborUI();
    switchTab('dashboard');
  } else if (APP_URLS[id]) {
    window.location.href = APP_URLS[id];
  } else {
    _showModulePreview(id);
  }
}

function initSuiteDrum() {
  // Assign per-face colors and hard-reset to Labor (face 0)
  _applyFaceColors();
  const drum = document.getElementById('suiteDrum');
  if (drum) {
    drum.style.transition = 'none';
    drum.style.transform = 'translateY(0)';
    _drumStep = 0;
    _drumIdx = 0;
    requestAnimationFrame(() => { if (drum) drum.style.transition = ''; });
  }

  // Hover: start spinning; mouse-leave: stop and settle back
  const btn = document.getElementById('suiteLaunchBtn');
  if (btn) {
    btn.addEventListener('mouseenter', () => {
      _drumHovering = true;
      if (!_launcherOpen) { _startDrum(); }
    });
    btn.addEventListener('mouseleave', () => {
      _drumHovering = false;
      if (!_launcherOpen) { _stopDrum(); _settleDrum(); }
    });
    btn.addEventListener('touchstart', () => {
      // handled by onclick -> toggleSuiteLauncher
    }, { passive: true });
  }
}
